<pre id="out" style="display:none">PENDING</pre>
<script>
  window.__errors = [];
  window.addEventListener("error", (e) => window.__errors.push(String(e.message) + " @" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejected: " + String(e.reason)));
  window.__sent = [];
  window.__listeners = [];
  window.__backend = {};
  window.chrome = {
    webview: {
      postMessage(message) {
        window.__sent.push(message);
        const handler = window.__backend[message.action];
        if (!handler) return;
        Promise.resolve()
          .then(() => handler(message.payload))
          .then(
            (value) => reply(message, true, value),
            (error) => reply(message, false, String(error.message || error))
          );
      },
      addEventListener(name, listener) {
        window.__listeners.push(listener);
      },
    },
  };
  function reply(message, ok, value) {
    for (const listener of window.__listeners) {
      listener({ data: { channel: message.channel, event: "result", payload: { requestId: message.requestId, ok, message: value } } });
    }
  }
</script>

  function column(key, heading, extra) {
    return Object.assign(
      { key, heading, name: heading, scope: "i", kind: "text", readOnly: false, unit: "", available: true, choices: null },
      extra || {}
    );
  }

  function fixtureGrid() {
    return {
      source: { kind: "schedule", id: 1 },
      title: "Doors",
      unitMode: "display",
      columns: [
        column("bip|-1|i", "Mark"),
        column("bip|-2|i", "Width", { kind: "number", unit: "mm" }),
        column("bip|-3|t", "Fire Rating", { scope: "t" }),
        column("bip|-4|i", "Level", { readOnly: true }),
      ],
      rows: [
        { id: 101, t: 11, c: "Doors", v: ["D1", "900 mm", "30", "L1"], x: [3] },
        { id: 102, t: 11, c: "Doors", v: ["D2", "900 mm", "30", "L1"], x: [3] },
        { id: 103, t: 12, c: "Doors", v: ["D3", "1000 mm", "60", "L2"], x: [3] },
        { id: 104, t: 12, c: "Doors", v: ["D4", "1000 mm", "60", "L2"], x: [3] },

      ],
      sort: [],
    };
  }

  function mount(options) {
    const settings = Object.assign({ grid: fixtureGrid(), dark: false, preference: "auto" }, options || {});
    window.__backend.schedules = () => [{ id: 1, name: "Doors" }, { id: 2, name: "Walls" }];
    window.__backend.load = () => settings.grid;
    window.__backend.available = () => [
      { key: "bip|-9|i", heading: "Comments", scope: "i" },
      { key: "bip|-3|t", heading: "Fire Rating", scope: "t" },
    ];
    window.__backend.theme = () => ({});
    window.__app = window.pyRevitAttributeGrid.mount("app", {
      channel: "c1",
      strings,
      dark: settings.dark,
      themePreference: settings.preference,
      start: { kind: "schedule", id: 1 },
    });
    return window.__app;
  }

  const mouse = (target, type, point) => {
    const box = target.getBoundingClientRect();
    target.dispatchEvent(
      new MouseEvent(type, Object.assign({ bubbles: true, clientX: box.left + box.width / 2, clientY: box.top + box.height / 2 }, point || {}))

  };

    mouse(cellAt(r, c), "mousedown", extra);
    mouse(cellAt(r, c), "mouseup", extra);
  };

    const transfer = new DataTransfer();
    transfer.setData("text/plain", text);
    window.__app.clip.dispatchEvent(new ClipboardEvent("paste", { clipboardData: transfer, bubbles: true, cancelable: true }));

    async core_merge_pulls() {
      const R = {};
      const make = (id, base, cur, t) => ({ id, t: t || 1, c: "", base: base.slice(), cur: cur.slice(), locked: new Set(), conflicts: new Map(), errors: new Map() });
      const fresh = (id, v, x, t) => ({ id, t: t || 1, c: "", v, x: x || [] });
      const first = core.mergeRows([make(1, ["A"], ["B"])], ["k|i"], [fresh(1, ["C"])], ["k|i"]);
      R.first = [first.rows[0].cur[0], first.rows[0].base[0], first.conflicts, [...first.rows[0].conflicts.entries()]];
      const second = core.mergeRows(first.rows, ["k|i"], [fresh(1, ["C"])], ["k|i"]);
      R.second = [second.rows[0].cur[0], second.rows[0].base[0], second.conflicts, [...second.rows[0].conflicts.entries()]];
      const matched = core.mergeRows(first.rows, ["k|i"], [fresh(1, ["B"])], ["k|i"]);
      R.revit_now_matches = [matched.rows[0].cur[0], matched.rows[0].base[0], matched.conflicts];
      const locked = core.mergeRows([make(1, ["A"], ["B"])], ["k|i"], [fresh(1, ["A"], [0])], ["k|i"]);
      R.locked = [locked.rows[0].cur[0], locked.dropped];
      const moved = core.mergeRows([make(1, ["A"], ["B"], 1)], ["k|t"], [fresh(1, ["A"], [], 2)], ["k|t"]);
      R.type_moved = [moved.rows[0].cur[0], moved.dropped];
      const instanceMoved = core.mergeRows([make(1, ["A"], ["B"], 1)], ["k|i"], [fresh(1, ["A"], [], 2)], ["k|i"]);
      R.instance_kept = [instanceMoved.rows[0].cur[0], instanceMoved.dropped];
      const followed = core.mergeRows([make(1, ["A"], ["B"], 1)], ["k|t"], [fresh(1, ["A"], [], 2), fresh(9, ["A"], [], 1)], ["k|t"]);
      R.type_followed = [followed.rows.map((r) => r.cur[0]), followed.dropped, followed.conflicts];
      const twoRows = core.mergeRows([make(1, ["A"], ["B"], 1), make(2, ["A"], ["B"], 1)], ["k|t"], [fresh(1, ["C"], [], 1), fresh(2, ["C"], [], 1)], ["k|t"]);
      R.type_conflict_counted_once = [twoRows.conflicts, twoRows.rows.map((r) => r.conflicts.size)];
      return R;
    },

          await wait(300);
          return walls;

        return fixtureGrid();

    async grid_virtualised() {
      const R = {};
      const rows = [];
      for (let i = 0; i < 5000; i++) rows.push({ id: i + 1, t: 1, c: "", v: ["M" + i, "900 mm", "30", "L1"], x: [3] });
      mount({ grid: Object.assign(fixtureGrid(), { rows }) });
      await wait(150);
      R.rendered_rows = document.querySelectorAll(".ae-row").length;
      R.body_height = document.querySelector(".ae-body").style.height;
      const scroll = document.querySelector(".ae-scroll");
      scroll.scrollTop = 26 * 4000;
      scroll.dispatchEvent(new Event("scroll"));
      window.__app.renderBody();
      R.first_after_scroll = document.querySelector(".ae-cell").textContent;
      R.last_row_available = document.querySelectorAll(".ae-row").length < 200;
      return R;
    },

  window.addEventListener("DOMContentLoaded", async () => {
    const name = new URLSearchParams(location.search).get("scenario");
    let result;
    try {
      result = await scenarios[name]();
    } catch (error) {
      result = { exception: String(error && error.stack || error) };
    }
    result.errors = window.__errors;
    document.getElementById("out").textContent = "RESULT " + JSON.stringify(result);
  });
