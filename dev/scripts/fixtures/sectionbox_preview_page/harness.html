<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Section Box Navigator preview page harness</title>
</head>
<body>
<div id="app" style="width:800px;height:500px"></div>
<pre id="out">PENDING</pre>
<script>
  if (new URLSearchParams(location.search).get("gl") !== "1") HTMLCanvasElement.prototype.getContext = () => null;
  window.__errors = [];
  window.addEventListener("error", (e) => window.__errors.push(String(e.message) + " @" + e.lineno));
  window.__sent = [];
  window.chrome = { webview: { postMessage: (m) => window.__sent.push(m), addEventListener() {} } };
</script>
<script src="../../../../extensions/pyRevitTools.extension/lib/scene3d/gl.js"></script>
<script src="../../../../extensions/pyRevitTools.extension/pyRevit.tab/Modify.panel/3D.pulldown/Section%20Box%20Navigator.pushbutton/preview.js"></script>
<script>
  const A = window.pyRevitSectionBoxPreview.api;
  const near = (a, b, eps) => Math.abs(a - b) <= (eps || 1e-9);
  const box = (extra) => Object.assign({
    origin: [0, 0, 0], bx: [1, 0, 0], by: [0, 1, 0], bz: [0, 0, 1], min: [-5, -5, 0], max: [5, 5, 10],
  }, extra || {});
  const word = new Proxy({}, { get: (t, k) => String(k) });

  function packed(array) {
    let binary = "";
    for (const b of new Uint8Array(array.buffer)) binary += String.fromCharCode(b);
    return btoa(binary);
  }

  const scenarios = {
    snap_levels() {
      const targets = { levels: [{ name: "L2", z: 12 }, { name: "L3", z: 20 }] };
      const p = [0, 0, 10], n = [0, 0, 1];
      const c = A.snapCandidates(p, n, targets);
      const near1 = A.bestSnap(1.8, c, 0.3);
      const far = A.bestSnap(5, c, 0.3);
      const down = A.snapCandidates([0, 0, 0], [0, 0, -1], { levels: [{ name: "L0", z: -3 }] });
      return {
        candidates: c.map((x) => [x.name, x.t]),
        snapped: [near1.t, near1.snap && near1.snap.name],
        free: [far.t, far.snap],
        downward: down.map((x) => x.t),
        side_face_gets_no_levels: A.snapCandidates([0, 0, 5], [1, 0, 0], targets).length,
      };
    },
    snap_grids() {
      const p = [0, 5, 3], n = [1, 0, 0];
      const parallel = { name: "A", segs: [[7, -20, 7, 20]] };
      const diagonal = { name: "D", segs: [[0, 0, 10, 10]] };
      const outside = { name: "O", segs: [[0, 20, 10, 30]] };
      const c = A.snapCandidates(p, n, { grids: [parallel, diagonal, outside] });
      const rotated = A.snapCandidates([0, 0, 0], [0, 1, 0], { grids: [{ name: "H", segs: [[-9, 4, 9, 4]] }] });
      const arc = A.snapCandidates(p, n, { grids: [{ name: "R", segs: [[2, 0, 3, 3], [3, 3, 4, 8], [4, 8, 6, 12]] }] });
      return {
        candidates: c.map((x) => [x.name, x.t]),
        rotated_parallel: rotated.map((x) => [x.name, x.t]),
        arc: arc.map((x) => [x.name, Number(x.t.toFixed(6))]),
      };
    },
    snap_scope_planes() {
      const scope = { name: "SB", box: box({ origin: [20, 0, 0], min: [-4, -4, 0], max: [4, 4, 6] }) };
      const planes = A.scopePlanes([scope]);
      const c = A.snapCandidates([0, 0, 3], [1, 0, 0], { planes });
      const top = A.snapCandidates([0, 0, 3], [0, 0, 1], { planes });
      return { sideCandidates: c.map((x) => [x.name, x.t]).sort((a, b) => a[1] - b[1]), top: top.map((x) => x.t) };
    },
    yaw_snap() {
      const grids = [{ name: "G", segs: [[0, 0, Math.cos(Math.PI / 6) * 10, Math.sin(Math.PI / 6) * 10]] }];
      const deg = (d) => (d * Math.PI) / 180;
      const tol = deg(3);
      const r30 = A.snapYaw(deg(31.5), grids, tol);
      const r120 = A.snapYaw(deg(118.5), grids, tol);
      const r45 = A.snapYaw(deg(45), grids, tol);
      return {
        snapped30: [Number((r30.yaw * 180 / Math.PI).toFixed(6)), r30.snap && r30.snap.name],
        snapped120: Number((r120.yaw * 180 / Math.PI).toFixed(6)),
        free45: [Number((r45.yaw * 180 / Math.PI).toFixed(6)), r45.snap],
      };
    },
    move_face() {
      const b = box();
      const up = A.moveFace(b, 2, 1, 2.5);
      const down = A.moveFace(b, 2, 0, -3);
      const collapse = A.moveFace(b, 0, 1, -10);
      const rotated = box({ bx: [0, 1, 0], by: [-1, 0, 0] });
      return {
        up_max_z: up.max[2], original_max_z: b.max[2], min_z_lowered: down.min[2],
        collapse: collapse, normal_x1: A.faceNormal(rotated, 0, 1), center_z1: A.faceCenter(b, 2, 1),
        center_x0: A.faceCenter(b, 0, 0),
      };
    },
    rotate_box() {
      const b = box({ origin: [3, 4, 1], min: [-5, -2, 0], max: [7, 6, 10] });
      const before = A.boxCenter(b);
      const r = A.setYaw(b, 0.7);
      const after = A.boxCenter(r);
      return {
        center_kept: before.every((v, i) => near(v, after[i], 1e-9)),
        yaw: near(A.yawOf(r), 0.7),
        bz: r.bz, minmax_kept: JSON.stringify([r.min, r.max]) === JSON.stringify([b.min, b.max]),
        orthonormal: near(r.bx[0] * r.by[0] + r.bx[1] * r.by[1], 0),
      };
    },
    fit_world_bounds() {
      const b = A.setYaw(box(), Math.PI / 4);
      const fitted = A.fitToWorldBounds(b, [0, 0, 0], [2, 2, 3], 1);
      const corners = A.boxCorners(fitted);
      const inside = [[0, 0, 0], [2, 2, 3], [0, 2, 3], [2, 0, 0]].every((p) => A.insideBox(fitted, p, 1e-9));
      return { inside, zmin: fitted.min[2], zmax: fitted.max[2], corners: corners.length };
    },
    axis_line() {
      const t = A.closestOnAxis([0, 0, 0], [1, 0, 0], [4, 5, 6], [0, -0.6, -0.8]);
      const parallel = A.closestOnAxis([0, 0, 0], [1, 0, 0], [0, 5, 0], [1, 0, 0]);
      return { t, parallel };
    },
    segment_distance() {
      return { d: A.distanceToSegment2d(5, 5, 0, 0, 10, 0), end: A.distanceToSegment2d(-3, 4, 0, 0, 10, 0) };
    },
    mount() {
      const app = window.pyRevitSectionBoxPreview;
      app.mount("app", {
        channel: "c", document: "d", strings: word, units: { factor: 0.3048, symbol: "m", decimals: 3 },
        view: { kind: "3d", name: "3D", box: box(), editable: ["x0", "x1", "y0", "y1", "z0", "z1"], blocker: null, camera: null, bookmarks: [{ id: "b1", name: "Уровень «1»" }] },
      });
      const p = app.instance;
        const R = {};
      p.setGuides({ levels: [{ name: "L1", z: 0 }, { name: "Этаж 2", z: 10 }], grids: [{ name: "A", segs: [[7, -20, 7, 20]] }], scopeBoxes: [] });
      const positions = new Float32Array([0, 0, 0, 4, 0, 0, 0, 4, 0]);
      const indices = new Uint32Array([0, 1, 2]);
      p._onEvent("scene", { progress: [1, 1], meshes: [{ id: 7, source: 0, group: "Walls", approx: false, positions: packed(positions), indices: packed(indices) }] });
      p._onEvent("sources", { done: true });
      R.elements = p.elements.size;
      R.groups = [...p.groups.keys()];
      R.bounds = p.elements.get("0:7").bounds;
      R.handles = [...document.querySelectorAll(".sbp-handle")].filter((h) => h.style.display !== "none").length;
      R.bookmark = document.querySelector(".sbp-side").textContent.includes("Уровень");
      p._commitBox(p.view.box);
      R.sent = window.__sent.map((m) => m.action);
      R.apply_box = window.__sent.find((m) => m.action === "apply_box").payload.box.max;
      R.size_text = document.querySelector(".sbp-size").textContent;
      p._onEvent("result", { requestId: window.__sent[window.__sent.length - 1].requestId, ok: false, message: "No" });
      R.pending_after_result = p.pending;
      R.status_class = document.querySelector(".sbp-status-text").className;
      p._onEvent("sources", { dropLinks: true });
      R.after_drop = p.elements.size;
      return R;
    },
  };

  scenarios.guides_and_presets = () => {
    const app = window.pyRevitSectionBoxPreview;
    app.mount("app", {
      channel: "c", document: "d", strings: word, units: { factor: 1, symbol: "ft", decimals: 2 },
      view: { kind: "3d", name: "3D", box: box({ min: [-5, -5, 10], max: [5, 5, 30] }), editable: ["x0", "x1", "y0", "y1", "z0", "z1"], blocker: null, camera: null, bookmarks: [] },
    });
    const p = app.instance;
    const levels = [-20, 0, 8, 12, 20, 28, 35, 60].map((z, i) => ({ name: "L" + i, z, elevation: z + 100 }));
    const grids = [{ name: "A", segs: [[-30, -40, -30, 40]] }, { name: "B", segs: [[-40, 0, 40, 0]] }, { name: "C", segs: [[10, -40, 10, 40]] }];
    p.setGuides({ levels, grids, scopeBoxes: [] });
    const R = {};
    R.shown_levels = p._visibleLevelIndexes().map((i) => levels[i].name);
    p.flags.allLevels = true;
    R.all_levels = p._visibleLevelIndexes().length;
    p.flags.allLevels = false;
    const hiddenChunk = { progress: [1, 1], meshes: [{ id: 1, source: 0, group: "Rooms", hidden: true, approx: false, positions: packed(new Float32Array([0, 0, 0, 1, 0, 0, 0, 1, 0])), indices: packed(new Uint32Array([0, 1, 2])) }] };
    p._onEvent("scene", hiddenChunk);
    R.rooms_visible = p.groups.get("Rooms").visible;
    p.setCameraPreset("iso");
    p._render();
    R.iso_level_labels = document.querySelectorAll(".sbp-label-level").length;
    R.iso_grid_labels = document.querySelectorAll(".sbp-label-grid").length;
    p.setCameraPreset("top");
    p.frameBounds({ min: [-45, -45, 0], max: [45, 45, 10] });
    p._render();
    R.top_level_labels = document.querySelectorAll(".sbp-label-level").length;
    R.top_grid_labels = document.querySelectorAll(".sbp-label-grid").length;
    p.setCameraPreset("front");
    R.front = { pitch: p.camera.pitch, ortho: p.camera.ortho, yawDeg: Number((p.camera.yaw * 180 / Math.PI).toFixed(6)) };
    p.setCameraPreset("side");
    R.side = { pitch: p.camera.pitch, yawDeg: Number((p.camera.yaw * 180 / Math.PI).toFixed(6)) };
    p.view.box = A.setYaw(p.view.box, Math.PI / 6);
    p.setCameraPreset("front");
    R.rotated_front_yawDeg = Number((p.camera.yaw * 180 / Math.PI).toFixed(6));
    return R;
  };

  scenarios.triangle_hit = () => {
    const pos = new Float32Array([0, 0, 0, 4, 0, 0, 0, 4, 0]);
    return {
      hit: A.triangleHit([1, 1, 5], [0, 0, -1], pos, 0),
      miss: A.triangleHit([3, 3, 5], [0, 0, -1], pos, 0),
      behind: A.triangleHit([1, 1, -5], [0, 0, -1], pos, 0),
    };
  };

  scenarios.pick_hover = () => {
    const app = window.pyRevitSectionBoxPreview;
    app.mount("app", {
      channel: "c", document: "d", strings: word, units: { factor: 1, symbol: "ft", decimals: 2 },
      view: { kind: "3d", name: "3D", box: box({ min: [-20, -20, -2], max: [20, 20, 12] }), editable: ["x0", "x1", "y0", "y1", "z0", "z1"], blocker: null, camera: null, bookmarks: [] },
    });
    const p = app.instance;
    p.setGuides({ levels: [], grids: [{ name: "G1", segs: [[-30, 0, 30, 0]] }], scopeBoxes: [] });
    const wall = new Float32Array([0, 0, 0, 6, 0, 0, 6, 0, 8, 0, 0, 0, 6, 0, 8, 0, 0, 8]);
    const slab = new Float32Array([-15, -15, 0, 15, -15, 0, 15, 15, 0, -15, -15, 0, 15, 15, 0, -15, 15, 0]);
    const idx = new Uint32Array([0, 1, 2, 3, 4, 5]);
    const chunk = (id, group, pos) => ({ id, source: 0, group, approx: false, positions: packed(pos), indices: packed(idx) });
    p._onEvent("scene", { progress: [2, 2], meshes: [chunk(11, "Floors", slab), chunk(12, "Walls", wall)] });
    p.setCameraPreset("iso");
    p.frameBounds({ min: [-20, -20, 0], max: [20, 20, 10] });
    p._render();
    const rect = p.canvas.getBoundingClientRect();
    const eventAt = (w) => { const s = p._project(p.viewProj, w); return { clientX: rect.left + s.x, clientY: rect.top + s.y }; };
    const R = {};
    p.setMode("element");
    const onWall = p._hoverAt(eventAt([3, 0, 4]));
    R.wall = onWall && { label: onWall.label, boxContainsElement: [[0, 0, 0], [6, 0, 8]].every((q) => A.insideBox(onWall.box, q, 1e-6)), zmin: onWall.box.min[2] };
    const onSlab = p._hoverAt(eventAt([-10, 8, 0]));
    R.slab = onSlab && onSlab.label;
    R.nothing = p._hoverAt({ clientX: rect.left + 2, clientY: rect.top + 2 });
    p.hover = onWall;
    p._render();
    R.status_hint = document.querySelector(".sbp-status-text").textContent;
    p.setMode("grid");
    p._render();
    const gridHover = p._hoverAt(eventAt([10, 0, p.gridZ]));
    R.grid = gridHover && { label: gridHover.label, yawDeg: Number((A.yawOf(gridHover.box) * 180 / Math.PI).toFixed(6)) };
    p.hover = gridHover;
    p._render();
    R.svg_lines = p.overlay.querySelectorAll("line").length;
    p.setMode(null);
    R.cleared = { hover: p.hover, lines: p.overlay.querySelectorAll("line").length, status: document.querySelector(".sbp-status-text").textContent };
    return R;
  };

  scenarios.review_fixes = () => {
    const app = window.pyRevitSectionBoxPreview;
    const keydown = { added: 0, removed: 0 };
    const add = window.addEventListener.bind(window), remove = window.removeEventListener.bind(window);
    window.addEventListener = (type, ...rest) => { if (type === "keydown") keydown.added++; return add(type, ...rest); };
    window.removeEventListener = (type, ...rest) => { if (type === "keydown") keydown.removed++; return remove(type, ...rest); };
    const payload = () => ({
      channel: "c", document: "d", strings: word, units: { factor: 1, symbol: "ft", decimals: 2 },
      view: { kind: "3d", name: "3D", box: box({ min: [-5, -5, 0], max: [5, 5, 10] }), editable: ["x0", "x1", "y0", "y1", "z0", "z1"], blocker: null, camera: null, bookmarks: [] },
    });
    app.mount("app", payload());
    const p = app.instance;
    p._render();
    const R = {};

    p.commitRequest("bookmark_save", { name: "x", box: p.view.box });
    const id = window.__sent[window.__sent.length - 1].requestId;
    R.pending_before_error = p.pending;
    p._onEvent("error", { action: "bookmark_save", requestId: id, message: "boom" });
    R.pending_after_error = p.pending;
    R.request_cleared = !p.requests.has(id);
    R.error_status = document.querySelector(".sbp-status-text").className;
    p._onEvent("result", { requestId: "unknown", ok: true });
    R.pending_after_unknown = p.pending;
    p._onEvent("error", { message: "stream failed" });
    R.pending_after_stream_error = p.pending;

    const fire = (target, type, x, y, extra) => target.dispatchEvent(new PointerEvent(type, Object.assign({ clientX: x, clientY: y, bubbles: true, pointerId: 4 }, extra || {})));
    const rect = p.canvas.getBoundingClientRect();
    const screenOf = (w) => { const s = p._project(p.viewProj, w); return [rect.left + s.x, rect.top + s.y]; };

    const top = A.faceCenter(p.view.box, 2, 1);
    const [tx, ty] = screenOf(top);
    fire(p.rotateHandle, "pointerdown", tx, ty - 10);
    R.rotate_started = p.drag && p.drag.kind;
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    R.drag_after_escape = p.drag;
    fire(p.rotateHandle, "pointermove", tx + 25, ty - 10);
    fire(p.rotateHandle, "pointerup", tx + 25, ty - 10);

    p.flags.live = true;
    const sentBefore = window.__sent.filter((m) => m.action === "apply_box").length;
    const original = A.cloneBox(p.view.box);
    fire(p.handles.z1, "pointerdown", tx, ty);
    p.drag.lastSend = -1e6;
    fire(p.handles.z1, "pointermove", tx, ty - 25);
    R.live_box_moved = p.view.box.max[2] !== original.max[2];
    R.live_sent = window.__sent.filter((m) => m.action === "apply_box").length - sentBefore;
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    const applies = window.__sent.filter((m) => m.action === "apply_box");
    R.restore_sent = applies.length - sentBefore;
    R.restored_max_z = applies[applies.length - 1].payload.box.max[2];
    R.page_max_z = p.view.box.max[2];

    app.mount("app", payload());
    R.keydown = keydown;
    window.addEventListener = add;
    window.removeEventListener = remove;
    return R;
  };

  scenarios.gl_smoke = () => {
    const app = window.pyRevitSectionBoxPreview;
    app.mount("app", {
      channel: "c", document: "d", strings: word, units: { factor: 1, symbol: "ft", decimals: 2 },
      view: { kind: "3d", name: "3D", box: box({ min: [-20, -20, -2], max: [20, 20, 12] }), editable: ["x0", "x1", "y0", "y1", "z0", "z1"], blocker: null, camera: null, bookmarks: [] },
    });
    const p = app.instance;
    if (!p.gl) return { gl: false };
    p.setGuides({ levels: [{ name: "L1", z: 0 }], grids: [{ name: "G1", segs: [[-30, 0, 30, 0]] }], scopeBoxes: [] });
    const wall = new Float32Array([0, 0, 0, 6, 0, 0, 6, 0, 8, 0, 0, 0, 6, 0, 8, 0, 0, 8]);
    p._onEvent("scene", { progress: [1, 1], meshes: [{ id: 12, source: 0, group: "Walls", approx: false, positions: packed(wall), indices: packed(new Uint32Array([0, 1, 2, 3, 4, 5])) }] });
    p.setMode("element");
    p.setCameraPreset("iso");
    p.frameBounds({ min: [-20, -20, 0], max: [20, 20, 10] });
    p._render();
    const rect = p.canvas.getBoundingClientRect();
    const s = p._project(p.viewProj, [3, 0, 4]);
    p.hover = p._hoverAt({ clientX: rect.left + s.x, clientY: rect.top + s.y });
    p._render();
    p.setMode("grid");
    p._render();
    return { gl: true, error: p.gl.getError(), hovered: p.groups.has("Walls"), elements: p.elements.size };
  };

  (async () => {
    const name = new URLSearchParams(location.search).get("scenario");
    let result = {};
    try {
      if (!scenarios[name]) throw new Error("unknown scenario " + name);
      result = await scenarios[name]();
    } catch (error) {
      result = { exception: String((error && error.stack) || error) };
    }
    result.errors = window.__errors;
    document.getElementById("out").textContent = "RESULT " + JSON.stringify(result);
  })();
</script>
</body>
</html>
