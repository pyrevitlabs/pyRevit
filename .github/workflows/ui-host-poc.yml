name: UI Host PoC

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/ui-host-poc.yml'
      - 'dev/pyRevitLabs.UI.*/**'
      - 'dev/pyRevitLoader/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show .NET SDK
        run: dotnet --info

      - name: Run UI host smoke test
        shell: pwsh
        run: ./dev/pyRevitLabs.UI.Smoke/run-smoke.ps1
