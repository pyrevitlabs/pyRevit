name: pyRevitDocsCI
on:
  # when PRs from forked repos are merged
  push:
    branches:
      - docs
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'pyrevitlib/**'
      - '*.md'
  # when PR from develop->master is created
  pull_request:
    branches:
      - master
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'pyrevitlib/**'
      - '*.md'
  # manual run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Prepare Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Prepare pipenv
        run: |
          pip install pipenv
          pipenv sync

      - name: Build docs
        run: pipenv run mkdocs build --site-dir site

      - name: Check out gh-pages
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Deploy docs
        env:
          COMMIT_MESSAGE: "docs: deploy ${{ github.sha }}"
        run: bash .github/scripts/publish-gh-pages.sh publish site .
