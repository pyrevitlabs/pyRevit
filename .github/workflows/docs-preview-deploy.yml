name: pyRevit Docs Preview Deploy
# Publishes the site built by docs-preview.yml to
# https://docs.pyrevitlabs.io/pr-preview/pr-<number>/ and removes it when the
# pull request closes.
#
# Both triggers run this file from the default branch with a write token, even
# for pull requests from forks. Nothing here checks out or executes pull request
# code: the deploy job only copies the already-built static site.
on:
  workflow_run:
    workflows: ["pyRevit Docs Preview"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions: {}

env:
  PREVIEW_BASE_URL: https://docs.pyrevitlabs.io/pr-preview
  # A fork's preview is published automatically only for these author
  # associations; anyone else needs a maintainer to add the docs-preview label.
  TRUSTED_ASSOCIATIONS: '["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    concurrency:
      group: docs-preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The artifact cannot be trusted to say which pull request it belongs to,
      # so look the pull request up from the run's head branch and commit.
      - name: Find pull request
        id: pr
        env:
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" \
                  -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" -f per_page=100 \
                | jq -c --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha)][0] // empty')"
          if [[ -z "$pr" ]]; then
            echo "::notice::No open pull request at $HEAD_SHA (closed, or a newer commit was pushed). Skipping."
            exit 0
          fi
          number="$(jq -r '.number' <<< "$pr")"
          publish="$(jq -r --arg repo "$GITHUB_REPOSITORY" --argjson trusted "$TRUSTED_ASSOCIATIONS" '
            (.head.repo.full_name == $repo)
            or (.author_association as $a | $trusted | index($a) != null)
            or any(.labels[]; .name == "docs-preview")' <<< "$pr")"
          {
            echo "number=$number"
            echo "publish=$publish"
            echo "short_sha=${HEAD_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out scripts
        if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Ask for the docs-preview label
        if: steps.pr.outputs.number && steps.pr.outputs.publish != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > "$RUNNER_TEMP/comment.md" <<BODY
          ### Docs preview

          The docs built successfully for \`$SHORT_SHA\`. Previews of pull requests from first-time contributors are not published automatically.

          - Download the built site from the [workflow run]($RUN_URL) (artifact \`docs-preview-site\`).
          - Maintainers: after reviewing the changes, add the \`docs-preview\` label to publish the preview.
          BODY
          bash tools/.github/scripts/pr-sticky-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/comment.md"

      - name: Download site
        if: steps.pr.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview-site
          path: ${{ runner.temp }}/site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check site
        if: steps.pr.outputs.publish == 'true'
        run: |
          cd "$RUNNER_TEMP/site"
          find . -type l -delete
          test -f index.html
          size_mb="$(du -sm . | cut -f1)"
          if (( size_mb > 300 )); then
            echo "::error::Built site is ${size_mb} MB, refusing to publish it."
            exit 1
          fi

      - name: Check out gh-pages
        if: steps.pr.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Publish preview
        if: steps.pr.outputs.publish == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
        run: |
          COMMIT_MESSAGE="docs: preview for #$PR_NUMBER ($SHORT_SHA)" \
            bash tools/.github/scripts/publish-gh-pages.sh publish "$RUNNER_TEMP/site" "pr-preview/pr-$PR_NUMBER"

      - name: Comment with preview link
        if: steps.pr.outputs.publish == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
        run: |
          cat > "$RUNNER_TEMP/comment.md" <<BODY
          ### Docs preview

          **$PREVIEW_BASE_URL/pr-$PR_NUMBER/**

          Built from \`$SHORT_SHA\`. GitHub Pages can take a minute or two to show the latest build. The preview is removed when this pull request is closed.
          BODY
          bash tools/.github/scripts/pr-sticky-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/comment.md"

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Scripts come from the default branch, never from the pull request.
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Remove preview
        id: remove
        run: |
          COMMIT_MESSAGE="docs: remove preview for #$PR_NUMBER" \
            bash tools/.github/scripts/publish-gh-pages.sh remove "pr-preview/pr-$PR_NUMBER"

      - name: Update comment
        run: |
          echo "### Docs preview"$'\n\n'"The preview was removed because this pull request was closed." > "$RUNNER_TEMP/comment.md"
          bash tools/.github/scripts/pr-sticky-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/comment.md" --update-only
