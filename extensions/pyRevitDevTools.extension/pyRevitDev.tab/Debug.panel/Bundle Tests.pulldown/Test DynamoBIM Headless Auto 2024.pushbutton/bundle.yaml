title: Test DynamoBIM Headless Auto 2024
tooltip: "Balloon test for running a Dynamo graph headless, pinned to Revit 2024. Click the button in non debug mode and pyRevIt must run the graph without showing the Dynamo UI. The graph runs Automatic. It first appends a timestamped line to pyrevit-headless-proof/2024/headless-auto.log, which is the evidence that survives a headless run, and then creates a 3D text element named 'pyRevit headless proof 2024' in the current model, so the recording shows the run happened. Uses the CPython3 graph engine, the name Dynamo 2.19 and 3.x register, and writes the marker with the standard library. Generated from one template; do not hand-edit."
