title: Test DynamoBIM Headless Manual
tooltip: 'Regression test for a headless Dynamo run that cannot execute. The graph is saved with its Run setting on Manual and the bundle runs in automation mode, where Dynamo only runs Automatic graphs. Click the button in non debug mode: pyRevit must show a "Dynamo would not run the graph" dialog, and no Dynamo_Manual_Graph_SHOULD_NOT_RUN_*.txt file may appear in C:\Temp.'
author: "{{author}}"
highlight: new
min_revit_version: '2024'
engine:
  clean: false
  automate: true
