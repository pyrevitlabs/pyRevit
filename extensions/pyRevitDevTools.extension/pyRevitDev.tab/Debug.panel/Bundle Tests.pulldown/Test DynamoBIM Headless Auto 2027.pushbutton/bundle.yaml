title: Test DynamoBIM Headless Auto 2027
tooltip: 'Balloon test for running a Dynamo graph headless, pinned to Revit 2027. Click the button in non debug mode and pyRevIt must run the graph without showing the Dynamo UI. The graph runs automatic, creates two walls in the current model, and writes a timestamped Dynamo_Wall_Test_2027_*.txt marker file, which is the evidence that survives a headless run. Uses the PythonNet3 graph engine and nothing beyond the standard library and clr interop.'
