title:
  en_us: Set Revision On Sheets ●
  ko: 시트에 수정 사항 설정 ●
  fr_fr: Active la Révision sur les Feuilles ●
  ru: Установить изменение на листах ●
  chinese_s: 在图纸上设置修订 ●
  es_es: Establecer revisión en hojas ●
  de_de: Aktiviere eine Änderung auf Plänen ●
  pt_br: Definir Revisão nas Folhas ●
tooltip:
  en_us: |-
    Select a revision and add it to all sheets in the model.

    Shift-click:
    Set the revision even if it is marked as issued.
  ko: |-
    수정 사항을 선택하여 모델의 모든 시트에 추가합니다.

    Shift 키를 누르고 클릭:
    발행된 수정 사항도 설정합니다.
  fr_fr: |-
    Sélectionne une révision et l'ajoute à toutes les feuilles du modèle.

    Maj+clic :
    Appliquer la révision même si elle est marquée comme publiée.
  ru: |-
    Выбирает изменение и добавляет его на все листы модели.

    Щелчок с удержанием клавиши Shift:
    Установить изменение, даже если оно отмечено как выпущенное.
  chinese_s: |-
    选择一个修订并将其添加到模型中的所有图纸。

    按住 Shift 键单击：
    即使修订已标记为已发布，也将其设置到图纸上。
  es_es: |-
    Selecciona una revisión y la añade a todas las hojas del modelo.

    Mayús-clic:
    Aplicar la revisión aunque esté marcada como emitida.
  de_de: |-
    Wählt eine Revision aus und fügt sie allen Plänen im Modell hinzu.

    Bei gedrückter Umschalttaste klicken:
    Die Revision auch dann festlegen, wenn sie als ausgegeben markiert ist.
  pt_br: |-
    Seleciona uma revisão e a adiciona a todas as folhas do modelo.

    Clique mantendo a tecla Shift pressionada:
    Definir a revisão mesmo que esteja marcada como emitida.
context:
