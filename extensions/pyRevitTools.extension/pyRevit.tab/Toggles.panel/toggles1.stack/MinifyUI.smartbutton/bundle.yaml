title:
  en_us: Minify Revit UI
  ko: Revit UI 최소화
  fr_fr: Minimiser UI Revit
  ru: Мини-ть RevitUI
  chinese_s: 简化 Revit 界面
  es_es: Minify Revit UI
  de_de: Revit UI minimieren
  pt_br: Mini Revit UI
tooltip:
  en_us: |-
    Toggle the minimized Revit tab layout.

    Shift-click:
    Choose which tabs are hidden when the interface is minimized.
  ko: |-
    Revit 탭 레이아웃을 최소화하거나 복원합니다.

    Shift 키를 누르고 클릭:
    인터페이스를 최소화할 때 숨길 탭을 선택합니다.
  fr_fr: >-
    Réduire la liste des onglets Revit ouverts

    Maj+clic :

    Personnalisez les onglets à masquer en mode minimisé
  ru: >-
    Минимизирует список открытых вкладок Revit.

    Щелчок с удержанием клавиши Shift:

    Настроить, какие вкладки должны быть скрыты в мини-режиме.
  chinese_s: |-
    切换 Revit 选项卡的最小化布局。

    按住 Shift 键单击：
    选择界面最小化时隐藏的选项卡。
  es_es: >-
    Reduce the list of open Revit tabs

    Mayús-clic:

    Customize which tabs should be hidden in minified mode
  de_de: >-
    Die Aktivierung reduziert die Anzahl der Registerkarten der Revit Multifunktionsleiste. Welche Registerkarten dabei ausgeblendet werden, wird in den Einstellungen festgelegt. Diese öffnet man, indem man bei gedrückter Umschalttaste auf das Werkzeug klickt.

    Bei gedrückter Umschalttaste klicken:

    Es öffnet sich ein Auswahldialog mit allen verfügbaren Registerkarten.  Alle Register die hier ausgewählt werden, werden ausgeblendet,  wenn man den Befehl "Revit UI minimieren" aktiviert.
  pt_br: >-
    Reduz a lista de abas abertas do Revit
    
    Clique mantendo a tecla Shift pressionada:
    
    Personalizar quais abas devem ser ocultadas no modo minimizado
context: zero-doc
