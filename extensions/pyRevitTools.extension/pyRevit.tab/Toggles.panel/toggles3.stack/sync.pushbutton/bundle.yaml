title:
  en_us: Synchronize
  ko: 동기화
  fr_fr: Synchroniser
  ru: Синхронизация
  chinese_s: 同步
  es_es: Sincronizar
  de_de: Synchronisieren
  pt_br: Sincronizar
tooltip:
  en_us: |-
    Synchronize the current model with the central model using the pyRevit workflow.

    Shift-click:
    Choose how open views are handled during synchronization: leave them open, close and reopen them, or close them and switch to the starting view.
  ko: |-
    pyRevit 동기화 워크플로를 사용하여 현재 모델을 중앙 모델과 동기화합니다.

    Shift 키를 누르고 클릭:
    동기화 중 열린 뷰를 유지할지, 닫았다가 다시 열지, 닫고 시작 뷰로 전환할지 선택합니다.
  fr_fr: |-
    Synchronise le modèle actuel avec le modèle central à l'aide du flux de travail pyRevit.

    Maj+clic :
    Choisir de laisser les vues ouvertes, de les fermer puis de les rouvrir, ou de les fermer et d'afficher la vue de départ pendant la synchronisation.
  ru: |-
    Синхронизирует текущую модель с центральной моделью с помощью рабочего процесса pyRevit.

    Щелчок с удержанием клавиши Shift:
    Выбрать, оставить ли открытые виды, закрыть и открыть их снова или закрыть и перейти к начальному виду во время синхронизации.
  chinese_s: |-
    使用 pyRevit 工作流程将当前模型与中心模型同步。

    按住 Shift 键单击：
    选择同步时如何处理打开的视图：保持打开、关闭后重新打开，或关闭并切换到起始视图。
  es_es: |-
    Sincroniza el modelo actual con el modelo central mediante el flujo de trabajo de pyRevit.

    Mayús-clic:
    Elegir si las vistas abiertas se mantienen, se cierran y vuelven a abrir, o se cierran para cambiar a la vista inicial.
  de_de: |-
    Synchronisiert das aktuelle Modell mit dem Zentralmodell über den pyRevit-Workflow.

    Bei gedrückter Umschalttaste klicken:
    Festlegen, ob geöffnete Ansichten offen bleiben, geschlossen und wieder geöffnet oder geschlossen und zur Startansicht gewechselt werden.
  pt_br: |-
    Sincroniza o modelo atual com o modelo central usando o fluxo de trabalho do pyRevit.

    Clique mantendo a tecla Shift pressionada:
    Escolher se as vistas abertas permanecem abertas, são fechadas e reabertas ou fechadas com mudança para a vista inicial.
author: Aniket Dikshit, Jean-Marc Couffin
