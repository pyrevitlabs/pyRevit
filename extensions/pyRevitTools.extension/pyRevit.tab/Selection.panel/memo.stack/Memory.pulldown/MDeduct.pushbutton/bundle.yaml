title:
  en_us: MDeduct
  ko: 메모리 제외
  fr_fr: MDéduire
  ru: ПУдалить
  chinese_s: M减去
  es_es: MDeducir
  de_de: Aktuelle Auswahl vom Speicher abziehen
  pt_br: MDeduct
tooltip:
  en_us: |-
    Remove the selected elements from the selection memory of the active document and keep the rest, like M- on a calculator.

    Each document has its own memory, saved as a .pym file in %appdata%\pyRevit.
  de_de: |-
    Entfernt die gewählten Elemente aus dem Auswahlspeicher des aktiven Dokuments und behält den Rest, wie M- beim Taschenrechner.

    Jedes Dokument hat seinen eigenen Speicher, der als .pym-Datei in %appdata%\pyRevit gespeichert wird.
  fr_fr: |-
    Retire les éléments sélectionnés de la mémoire de sélection du document actif et garde le reste, comme M- sur une calculatrice.

    Chaque document a sa propre mémoire, enregistrée sous forme de fichier .pym dans %appdata%\pyRevit.
  es_es: |-
    Quita los elementos seleccionados de la memoria de selección del documento activo y conserva el resto, como M- en una calculadora.

    Cada documento tiene su propia memoria, guardada como archivo .pym en %appdata%\pyRevit.
  pt_br: |-
    Remove os elementos selecionados da memória de seleção do documento ativo e mantém o restante, como o M- de uma calculadora.

    Cada documento tem sua própria memória, salva como arquivo .pym em %appdata%\pyRevit.
  ru: |-
    Удаляет выбранные элементы из памяти выбора активного документа, остальные остаются, как кнопка M- в калькуляторе.

    У каждого документа своя память, которая хранится в файле .pym в папке %appdata%\pyRevit.
  chinese_s: |-
    从活动文档的选择内存中移除所选图元并保留其余部分，功能类似于计算器上的 M- 按钮。

    每个文档都有自己的内存，保存为 %appdata%\pyRevit 中的 .pym 文件。
  ko: |-
    선택한 요소를 활성 문서의 선택 메모리에서 제거하고 나머지는 유지합니다. 계산기의 M- 버튼과 같습니다.

    각 문서에는 자체 메모리가 있으며 %appdata%\pyRevit 폴더에 .pym 파일로 저장됩니다.
context: selection
