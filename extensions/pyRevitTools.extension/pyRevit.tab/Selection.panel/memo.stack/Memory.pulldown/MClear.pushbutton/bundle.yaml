title:
  en_us: MClear
  ko: 메모리 지우기
  fr_fr: MEffacer
  ru: ПОчистить
  chinese_s: M清除
  es_es: MLimpiar
  de_de: Auswahl im Speicher löschen
  pt_br: MClear
tooltip:
  en_us: |-
    Empty the selection memory of the active document, like MC on a calculator.

    Each document has its own memory, saved as a .pym file in %appdata%\pyRevit.
  de_de: |-
    Leert den Auswahlspeicher des aktiven Dokuments, wie MC beim Taschenrechner.

    Jedes Dokument hat seinen eigenen Speicher, der als .pym-Datei in %appdata%\pyRevit gespeichert wird.
  fr_fr: |-
    Vide la mémoire de sélection du document actif, comme MC sur une calculatrice.

    Chaque document a sa propre mémoire, enregistrée sous forme de fichier .pym dans %appdata%\pyRevit.
  es_es: |-
    Vacía la memoria de selección del documento activo, como MC en una calculadora.

    Cada documento tiene su propia memoria, guardada como archivo .pym en %appdata%\pyRevit.
  pt_br: |-
    Esvazia a memória de seleção do documento ativo, como o MC de uma calculadora.

    Cada documento tem sua própria memória, salva como arquivo .pym em %appdata%\pyRevit.
  ru: |-
    Очищает память выбора активного документа, как кнопка MC в калькуляторе.

    У каждого документа своя память, которая хранится в файле .pym в папке %appdata%\pyRevit.
  chinese_s: |-
    清空活动文档的选择内存，功能类似于计算器上的 MC 按钮。

    每个文档都有自己的内存，保存为 %appdata%\pyRevit 中的 .pym 文件。
  ko: |-
    활성 문서의 선택 메모리를 비웁니다. 계산기의 MC 버튼과 같습니다.

    각 문서에는 자체 메모리가 있으며 %appdata%\pyRevit 폴더에 .pym 파일로 저장됩니다.
context:
  any:
    - doc-project
    - doc-family
