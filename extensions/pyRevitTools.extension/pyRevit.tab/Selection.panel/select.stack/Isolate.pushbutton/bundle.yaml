title:
  en_us: Isolate
  ko: 격리
  fr_fr: Isoler
  ru: Изолировать
  chinese_s: 隔离
  es_es: Aislar
  de_de: Isolieren
  pt_br: Isolar
tooltip:
  en_us: |-
    Temporarily isolate elements of a chosen category or type in the active view.

    Shift-click:
    Choose favorite categories for the isolate tool.
  ko: |-
    활성 뷰에서 선택한 카테고리 또는 유형의 요소를 임시로 격리합니다.

    Shift 키를 누르고 클릭:
    격리 도구에서 사용할 즐겨찾기 카테고리를 선택합니다.
  fr_fr: |-
    Isole temporairement dans la vue active les éléments d'une catégorie ou d'un type choisi.

    Maj+clic :
    Choisir les catégories favorites de l'outil d'isolation.
  ru: |-
    Временно изолирует в текущем виде элементы выбранной категории или типа.

    Щелчок с удержанием клавиши Shift:
    Выбрать избранные категории для инструмента изоляции.
  chinese_s: |-
    在活动视图中临时隔离所选类别或类型的图元。

    按住 Shift 键单击：
    选择隔离工具的收藏类别。
  es_es: |-
    Aísla temporalmente en la vista activa los elementos de una categoría o tipo elegido.

    Mayús-clic:
    Elegir las categorías favoritas de la herramienta de aislamiento.
  de_de: >-
    Isoliert vorübergehend Elemente einer ausgewählten Kategorie oder eines Typs in der aktiven Ansicht. Folgende Kategorien stehen als Schnellauswahl zur Verfügung:
    1) Flächenbegrenzungen
    2) Fenster
    3) Geschossdecken
    4) Skelettbau
    5) Stützen
    6) Tragwerkstützen
    7) Türen
    8) Wände
    9) Room Tags (Raumbeschriftungen)
    10) Model Groups (Modellgruppen)
    11) Painted Elemente (Eingefärbte Elemente)
    12) Model Elements (Modellelemente)

    Bei gedrückter Umschalttaste klicken:
    Favoritenkategorien für das Isolieren auswählen.
  pt_br: |-
    Isola temporariamente na vista ativa os elementos de uma categoria ou tipo escolhido.

    Clique mantendo a tecla Shift pressionada:
    Escolher categorias favoritas para a ferramenta de isolamento.
