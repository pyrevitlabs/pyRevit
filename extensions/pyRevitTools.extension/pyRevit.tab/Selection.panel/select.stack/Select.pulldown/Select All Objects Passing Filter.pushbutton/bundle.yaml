title:
  en_us: Select All Objects Passing Filter
  ko: 필터를 통과하는 모든 객체 선택
  fr_fr: Sélectionner tous les objets correspondant au filtre
  ru: Выделить все объекты, проходящие через фильтр
  chinese_s: 选择所有通过过滤器的图元
  es_es: Seleccionar todos los objetos que pasan el filtro
  de_de: Alle Objekte auswählen, die dem Filter entsprechen
  pt_br: Selecionar Todos os Objetos Que Passam No Filtro
tooltip:
  en_us: |-
    Select the elements that pass any of the view filters you pick. By default the search covers the active view and skips nested family instances.

    Shift-click:
    Choose whether to search only the active view, whether to leave out nested family instances, and whether to select the elements that do not pass instead.
  ko: |-
    선택한 뷰 필터 중 하나라도 통과하는 요소를 선택합니다. 기본적으로 활성 뷰에서 검색하며 중첩된 패밀리 인스턴스는 건너뜁니다.

    Shift 키를 누르고 클릭:
    활성 뷰에서만 검색할지, 중첩된 패밀리 인스턴스를 제외할지, 대신 필터를 통과하지 않는 요소를 선택할지 설정합니다.
  fr_fr: |-
    Sélectionne les éléments qui correspondent à l'un des filtres de vue choisis. Par défaut, la recherche porte sur la vue active et ignore les instances de famille imbriquées.

    Maj+clic :
    Choisir si la recherche se limite à la vue active, si les instances de famille imbriquées sont exclues et si ce sont les éléments qui ne correspondent pas qui sont sélectionnés.
  ru: |-
    Выделяет элементы, проходящие любой из выбранных фильтров вида. По умолчанию поиск ведётся в текущем виде, вложенные экземпляры семейств пропускаются.

    Shift + Щелчок:
    Выбрать, искать ли только в текущем виде, исключать ли вложенные экземпляры семейств и выделять ли вместо этого элементы, не проходящие фильтр.
  chinese_s: |-
    选择通过所选任一视图过滤器的图元。默认情况下，搜索范围为活动视图，并跳过嵌套族实例。

    按住 Shift 键单击：
    设置是否仅搜索活动视图、是否排除嵌套族实例，以及是否改为选择未通过过滤器的图元。
  es_es: |-
    Selecciona los elementos que cumplen alguno de los filtros de vista elegidos. De forma predeterminada, la búsqueda abarca la vista activa y omite las instancias de familia anidadas.

    Mayús-clic:
    Elegir si se busca solo en la vista activa, si se excluyen las instancias de familia anidadas y si se seleccionan en su lugar los elementos que no cumplen.
  de_de: |-
    Wählt die Elemente aus, die einen der gewählten Ansichtsfilter erfüllen. Standardmäßig wird die aktive Ansicht durchsucht und verschachtelte Familienexemplare werden übersprungen.

    Bei gedrückter Umschalttaste klicken:
    Festlegen, ob nur die aktive Ansicht durchsucht wird, ob verschachtelte Familienexemplare ausgelassen werden und ob stattdessen die Elemente ausgewählt werden, die den Filter nicht erfüllen.
  pt_br: |-
    Seleciona os elementos que correspondem a qualquer um dos filtros de vista escolhidos. Por padrão, a busca abrange a vista ativa e ignora instâncias de família aninhadas.

    Clique mantendo a tecla Shift pressionada:
    Escolher se a busca fica só na vista ativa, se as instâncias de família aninhadas são excluídas e se são selecionados, em vez disso, os elementos que não correspondem.
context: doc-project
