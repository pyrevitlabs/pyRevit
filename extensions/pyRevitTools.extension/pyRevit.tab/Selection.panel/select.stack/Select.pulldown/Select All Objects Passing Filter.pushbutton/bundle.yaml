title:
  en_us: Select All Objects Passing Filter
  ko: 필터를 통과하는 모든 객체 선택
  fr_fr: Sélectionner tous les objets correspondant au filtre
  ru: Выделить все объекты, проходящие через фильтр
  chinese_s: 选择所有通过过滤器的图元
  es_es: Seleccionar todos los objetos que pasan el filtro
  de_de: Alle Objekte auswählen, die dem Filter entsprechen
  pt_br: Selecionar Todos os Objetos Que Passam No Filtro
tooltip:
  en_us: |-
    Select elements visible in the active view that pass the chosen view filters.

    Shift-click:
    Configure whether to search the whole project, exclude nested elements, or reverse the filter selection.
  ko: |-
    활성 뷰에서 선택한 필터를 통과해 표시되는 요소를 모두 선택합니다. 미리 정의된 조건으로 요소를 빠르게 필터링할 수 있습니다.

    Shift 키를 누르고 클릭:
    전체 프로젝트 검색, 중첩 요소 제외 또는 필터 결과 반전을 설정합니다.
  fr_fr: |-
    Sélectionne les éléments visibles dans la vue active qui correspondent aux filtres de vue choisis.

    Maj+clic :
    Configurer la recherche dans tout le projet, l'exclusion des éléments imbriqués ou l'inversion de la sélection par filtre.
  ru: |-
    Выделяет элементы, видимые в текущем виде и соответствующие выбранным фильтрам вида.

    Щелчок с удержанием клавиши Shift:
    Настроить поиск по всему проекту, исключение вложенных элементов или инверсию результатов фильтра.
  chinese_s: |-
    选择活动视图中可见且符合所选视图过滤器的图元。

    按住 Shift 键单击：
    配置是否搜索整个项目、排除嵌套图元或反转过滤结果。
  es_es: |-
    Selecciona los elementos visibles en la vista activa que cumplen los filtros de vista elegidos.

    Mayús-clic:
    Configurar si se busca en todo el proyecto, se excluyen elementos anidados o se invierte la selección del filtro.
  de_de: |-
    Wählt Elemente aus, die in der aktiven Ansicht sichtbar sind und den ausgewählten Ansichtsfiltern entsprechen.

    Bei gedrückter Umschalttaste klicken:
    Festlegen, ob das gesamte Projekt durchsucht, verschachtelte Elemente ausgeschlossen oder die Filterauswahl umgekehrt wird.
  pt_br: |-
    Seleciona os elementos visíveis na vista ativa que correspondem aos filtros de vista escolhidos.

    Clique mantendo a tecla Shift pressionada:
    Configurar se a busca abrange todo o projeto, exclui elementos aninhados ou inverte a seleção do filtro.
