title:
  en_us: Select All Objects Of Selected Type ●
  ko: 선택한 유형의 모든 객체 선택 ●
  fr_fr: Sélectionner tous les objets du type sélectionné ●
  ru: Выделить все объекты выделенного типа ●
  chinese_s: 选择选定类型的所有图元 ●
  es_es: Seleccionar todos los objetos del tipo seleccionado ●
  de_de: Alle Objekte des aktuell gewählten Typs auswählen ●
  pt_br: Selecionar Todos os Objetos do Tipo Selecionado ●
tooltip:
  en_us: |-
    Select all elements in the project that have the same type as the selected elements. Lines match by line style.

    Shift-click:
    Also list the selected elements in the output window: model elements first, then view-specific elements grouped by the view that owns them.
  ko: |-
    프로젝트에서 선택한 요소와 유형이 같은 모든 요소를 선택합니다. 선은 선 스타일로 일치시킵니다.

    Shift 키를 누르고 클릭:
    선택한 요소를 출력 창에도 나열합니다. 모델 요소가 먼저, 그다음 뷰 전용 요소가 소유 뷰별로 묶여 표시됩니다.
  fr_fr: |-
    Sélectionne tous les éléments du projet ayant le même type que les éléments sélectionnés. Les lignes correspondent par style de ligne.

    Maj+clic :
    Liste aussi les éléments sélectionnés dans la fenêtre de sortie : d'abord les éléments de modèle, puis les éléments propres à une vue, regroupés par vue.
  ru: |-
    Выделяет в проекте все элементы того же типоразмера, что и выбранные. Линии сопоставляются по стилю линии.

    Shift + Щелчок:
    Дополнительно выводит выбранные элементы в окне вывода: сначала элементы модели, затем элементы, принадлежащие видам, сгруппированные по виду.
  chinese_s: |-
    选择项目中与所选图元类型相同的所有图元。线按线样式匹配。

    按住 Shift 键单击：
    同时在输出窗口中列出所选图元：先列出模型图元，再按所属视图分组列出视图专有图元。
  es_es: |-
    Selecciona todos los elementos del proyecto del mismo tipo que los elementos seleccionados. Las líneas se comparan por estilo de línea.

    Mayús-clic:
    Muestra también los elementos seleccionados en la ventana de resultados: primero los elementos de modelo y después los elementos propios de una vista, agrupados por vista.
  de_de: |-
    Wählt alle Elemente im Projekt aus, die denselben Typ haben wie die ausgewählten Elemente. Linien werden nach Linienstil verglichen.

    Bei gedrückter Umschalttaste klicken:
    Listet die ausgewählten Elemente zusätzlich im Ausgabefenster auf: zuerst Modellelemente, danach ansichtsspezifische Elemente, gruppiert nach der Ansicht, zu der sie gehören.
  pt_br: |-
    Seleciona todos os elementos do projeto do mesmo tipo que os elementos selecionados. Linhas são comparadas pelo estilo de linha.

    Clique mantendo a tecla Shift pressionada:
    Lista também os elementos selecionados na janela de resultados: primeiro os elementos de modelo, depois os elementos próprios de uma vista, agrupados por vista.
context: selection
