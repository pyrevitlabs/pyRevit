title:
  en_us: Select All Text Notes
  ko: 모든 텍스트 메모 선택
  fr_fr: Sélectionner toutes les notes textuelles
  ru: Выделить все текстовые примечания
  chinese_s: 选择所有文字注释
  es_es: Seleccionar todas las notas de texto
  de_de: Alle Text Elemente im Projekt auswählen
  pt_br: Selecionar Todas as Notas de Texto
tooltip:
  en_us: Select all text notes in the model, including those on other views and sheets, and replace the current selection. This is helpful for spell checking.
  ko: 다른 뷰와 시트에 있는 것을 포함하여 모델의 모든 텍스트 메모를 선택하고 현재 선택 항목을 대체합니다. 맞춤법 검사에 유용합니다.
  fr_fr: Sélectionne toutes les notes textuelles du modèle, y compris celles des autres vues et feuilles, et remplace la sélection actuelle. Ceci est utile pour la vérification orthographique.
  ru: Выделяет все текстовые примечания в модели, в том числе на других видах и листах, и заменяет текущее выделение. Это полезно для проверки правописания.
  chinese_s: 选择模型中的所有文字注释（包括其他视图和图纸中的），并替换当前选择集。此功能有助于进行拼写检查。
  es_es: Selecciona todas las notas de texto del modelo, incluidas las de otras vistas y planos, y reemplaza la selección actual. Esto es útil para la verificación ortográfica.
  de_de: Wählt alle Textnotizen im Modell aus, auch die in anderen Ansichten und auf Plänen, und ersetzt die aktuelle Auswahl. Dies ist besonders nützlich für die Rechtschreibprüfung.
  pt_br: Seleciona todas as notas de texto do modelo, inclusive as de outras vistas e folhas, e substitui a seleção atual. Isso é útil para verificação ortográfica.
