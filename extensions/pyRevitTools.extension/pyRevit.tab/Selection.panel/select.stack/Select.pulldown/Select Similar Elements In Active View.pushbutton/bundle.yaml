title:
  en_us: Select Similar Elements In Active View ●
  ko: 활성 뷰에서 유사한 요소 선택 ●
  fr_fr: Sélectionner les éléments similaires dans la vue active ●
  ru: Выделить похожие элементы в текущем виде ●
  chinese_s: 在活动视图中选择类似图元 ●
  es_es: Seleccionar elementos similares en la vista activa ●
  de_de: Ähnliche Elemente in der aktiven Ansicht auswählen ●
  pt_br: Selecionar Elementos Similares na Vista Ativa ●
tooltip:
  en_us: |-
    Select elements similar to the currently selected elements in the active view.

    Shift-click:
    Search the whole project instead of only the active view.
  ko: |-
    활성 뷰에서 현재 선택한 요소와 유사한 요소를 선택합니다.

    Shift 키를 누르고 클릭:
    활성 뷰 대신 전체 프로젝트에서 검색합니다.
  fr_fr: >-
    Sélectionne des éléments similaires aux éléments

    actuels sélectionnés dans la vue active

    Maj+clic :

    sélectionner dans l'ensemble du projet
  ru: >-
    Выделяет похожие элементы в текущих

    выделенных элементов в текущем виде.

    Щелчок с удержанием клавиши Shift:

    Выделяет во всем проекте.
  chinese_s: "在活动视图中，选择与当前选定图元类似的图元

    按住 Shift 键单击：

    在整个项目中选择类似图元"
  es_es: >-
    Selecciona elementos similares a los elementos actualmente seleccionados en la vista activa

    Mayús-clic:

    seleccionar en todo el proyecto
  de_de: >-
    Es werden in der aktiven Ansicht die Elemente ausgewählt die dem aktuell gewähltem Element ähnlich sind. 

    Bei gedrückter Umschalttaste klicken:

    Es werden im gesamten Modell die Elemente ausgewählt die dem aktuell gewähltem Element ähnlich sind.
  pt_br: >-
    Seleciona elementos similares aos elementos
    
    atualmente selecionados na vista ativa
    
    Clique mantendo a tecla Shift pressionada:
    
    selecionar em todo o projeto
context: selection
