title:
  en_us: Select Similar Elements In Active View ●
  ko: 활성 뷰에서 유사한 요소 선택 ●
  fr_fr: Sélectionner les éléments similaires dans la vue active ●
  ru: Выделить похожие элементы в текущем виде ●
  chinese_s: 在活动视图中选择类似图元 ●
  es_es: Seleccionar elementos similares en la vista activa ●
  de_de: Ähnliche Elemente in der aktiven Ansicht auswählen ●
  pt_br: Selecionar Elementos Similares na Vista Ativa ●
tooltip:
  en_us: |-
    Select all elements in the active view that belong to a category of the selected elements.

    Shift-click:
    Search the whole project instead of the active view.
  ko: |-
    활성 뷰에서 선택한 요소와 같은 카테고리에 속한 모든 요소를 선택합니다.

    Shift 키를 누르고 클릭:
    활성 뷰 대신 전체 프로젝트에서 검색합니다.
  fr_fr: |-
    Sélectionne dans la vue active tous les éléments appartenant à une catégorie des éléments sélectionnés.

    Maj+clic :
    Rechercher dans l'ensemble du projet plutôt que dans la vue active.
  ru: |-
    Выделяет в текущем виде все элементы, относящиеся к категории выбранных элементов.

    Shift + Щелчок:
    Искать во всём проекте, а не только в текущем виде.
  chinese_s: |-
    选择活动视图中属于所选图元所在类别的所有图元。

    按住 Shift 键单击：
    在整个项目而非活动视图中搜索。
  es_es: |-
    Selecciona en la vista activa todos los elementos que pertenecen a una categoría de los elementos seleccionados.

    Mayús-clic:
    Buscar en todo el proyecto en lugar de en la vista activa.
  de_de: |-
    Wählt in der aktiven Ansicht alle Elemente aus, die zu einer Kategorie der ausgewählten Elemente gehören.

    Bei gedrückter Umschalttaste klicken:
    Das gesamte Projekt statt der aktiven Ansicht durchsuchen.
  pt_br: |-
    Seleciona na vista ativa todos os elementos que pertencem a uma categoria dos elementos selecionados.

    Clique mantendo a tecla Shift pressionada:
    Pesquisar em todo o projeto em vez de apenas na vista ativa.
context: selection
