title:
  en_us: Select SubWalls of Stacked Walls
  ko: 중첩 벽의 하위 벽 선택
  fr_fr: Sélectionner les murs empilés
  ru: Выделить стены в составной стене
  chinese_s: 选择叠层墙的子墙
  es_es: Seleccionar sub-muros de muros apilados
  de_de: Alle Unterwände von gestapelten Wänden auswählen
  pt_br: Selecionar Subparedes de Paredes Empilhadas
tooltip:
  en_us: Replace the selection with the member walls of the selected stacked walls. Selected walls that are not stacked stay selected, and everything else is dropped from the selection.
  ko: 현재 선택 항목을 선택한 중첩 벽의 구성 벽으로 대체합니다. 중첩 벽이 아닌 선택된 벽은 그대로 선택된 상태로 유지되며, 나머지는 모두 선택에서 제외됩니다.
  fr_fr: Remplace la sélection par les murs composant les murs empilés sélectionnés. Les murs sélectionnés qui ne sont pas empilés restent sélectionnés, et tout le reste est retiré de la sélection.
  ru: Заменяет выделение стенами, из которых состоят выбранные составные стены. Выбранные стены, не являющиеся составными, остаются выделенными, а всё остальное исключается из выделения.
  chinese_s: 用所选叠层墙的组成墙替换当前选择集。非叠层的已选墙保持选中，其余所有图元会从选择集中移除。
  es_es: Reemplaza la selección por los muros que componen los muros apilados seleccionados. Los muros seleccionados que no están apilados permanecen seleccionados, y todo lo demás se quita de la selección.
  de_de: Ersetzt die Auswahl durch die Teilwände der ausgewählten gestapelten Wände. Ausgewählte Wände, die nicht gestapelt sind, bleiben ausgewählt, alle anderen Elemente werden aus der Auswahl entfernt.
  pt_br: Substitui a seleção pelas paredes que compõem as paredes empilhadas selecionadas. As paredes selecionadas que não são empilhadas continuam selecionadas, e todo o resto é removido da seleção.
context: OST_StackedWalls
