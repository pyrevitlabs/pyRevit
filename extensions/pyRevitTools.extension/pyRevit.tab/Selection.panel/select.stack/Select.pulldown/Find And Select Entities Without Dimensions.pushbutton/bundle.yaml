title:
  en_us: Find And Select Entities Without Dimensions
  ko: 치수 없는 요소 찾아 선택
  fr_fr: Cherche et trouve les éléments sans dimensions
  ru: Найти и выделить элементы без размеров
  chinese_s: 查找并选择无关联标注的图元
  es_es: Encontrar y seleccionar entidades sin dimensiones
  de_de: Nur Elemente ohne Bemaßungsreferenzen auswählen
  pt_br: Encontrar e Selecionar Elementos sem Cotas
tooltip:
  en_us: Select the elements of one category that no dimension in the active view references. A window asks for the category (rooms, doors, walls, columns and more). Dimensions in other views do not count.
  ko: 활성 뷰의 어떤 치수도 참조하지 않는 한 카테고리의 요소를 선택합니다. 창에서 카테고리(방, 문, 벽, 기둥 등)를 선택합니다. 다른 뷰의 치수는 계산하지 않습니다.
  fr_fr: Sélectionne les éléments d'une catégorie qu'aucune cote de la vue active ne référence. Une fenêtre demande la catégorie (pièces, portes, murs, poteaux, etc.). Les cotes des autres vues ne comptent pas.
  ru: Выделяет элементы одной категории, на которые не ссылается ни один размер в текущем виде. В окне нужно выбрать категорию (помещения, двери, стены, колонны и другие). Размеры на других видах не учитываются.
  chinese_s: 选择某一类别中、活动视图里没有任何标注引用的图元。会弹出窗口让您选择类别（房间、门、墙、柱等）。其他视图中的标注不计算在内。
  es_es: Selecciona los elementos de una categoría a los que no hace referencia ninguna dimensión de la vista activa. Una ventana pregunta por la categoría (habitaciones, puertas, muros, pilares y más). Las dimensiones de otras vistas no cuentan.
  de_de: Wählt die Elemente einer Kategorie aus, auf die keine Bemaßung in der aktiven Ansicht verweist. Ein Fenster fragt nach der Kategorie (Räume, Türen, Wände, Stützen und weitere). Bemaßungen in anderen Ansichten zählen nicht.
  pt_br: Seleciona os elementos de uma categoria que nenhuma cota da vista ativa referencia. Uma janela pergunta a categoria (ambientes, portas, paredes, pilares e mais). As cotas de outras vistas não contam.
