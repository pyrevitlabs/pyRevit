title:
  en_us: Select Vertical/Horizontal Reveals ●
  ko: 수직/수평 리빌 선택 ●
  fr_fr: Sélectionner les profils verticaux/horizontaux ●
  ru: Выделить вертикальные/горизонтальные профили ●
  chinese_s: 选择垂直/水平凹槽 ●
  es_es: Seleccionar ranuras verticales/horizontales ●
  de_de: Alle horizontale / vertikalen Wandfugen auswählen ●
  pt_br: Selecionar Frisos Verticais/Horizontais ●
tooltip:
  en_us: |-
    Select all vertical wall reveals in the project.

    Shift-click:
    Select horizontal wall reveals instead.
  ko: |-
    프로젝트의 모든 수직 벽 홈을 선택합니다.

    Shift 키를 누르고 클릭:
    수평 벽 홈을 대신 선택합니다.
  fr_fr: >-
    Sélectionne tous les profils verticaux (par défaut) ou horizontaux dans le projet

    Maj+clic :

    Sélectionnez les profils horizontaux
  ru: >-
    Выделяет все вертикальные (по умолчанию) или горизонтальные профили в проекте.

    Щелчок с удержанием клавиши Shift:

    Выделить горизонтальные профили.
  chinese_s: "选择项目中的所有垂直（默认）或水平凹槽

    按住 Shift 键单击：

    选择水平凹槽"
  es_es: >-
    Selecciona todas las ranuras verticales (predeterminado) u horizontales en el proyecto

    Mayús-clic:

    Seleccionar ranuras horizontales
  de_de: >-
    Es werden alle vertikalen Wandfugen ausgewählt (Standardeinstellung)

    Bei gedrückter Umschalttaste klicken:

    Mit gedrückter Umschalttaste auf das Werkzeug werden alle horizontalen Wandfugen ausgewählt.
  pt_br: >-
    Seleciona todos os frisos verticais (padrão) ou horizontais no projeto
    
    Clique mantendo a tecla Shift pressionada:
    
    Selecionar frisos horizontais
