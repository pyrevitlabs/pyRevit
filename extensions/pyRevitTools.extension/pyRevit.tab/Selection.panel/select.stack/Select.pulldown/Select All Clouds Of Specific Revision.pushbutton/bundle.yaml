title:
  en_us: Select All Clouds Of Specific Revision
  ko: 특정 수정 사항의 모든 기호 선택
  fr_fr: Sélectionner tous les nuages d'une révision spécifique
  ru: Выделить все пометочные облака
  chinese_s: 选择特定修订的所有云线
  es_es: Seleccionar todas las nubes de revisión específica
  de_de: Alle Wolken einer bestimmten Änderung auswählen
  pt_br: Selecionar Todas as Nuvens de Uma Revisão Específica
tooltip:
  en_us: Select all revision clouds of one revision in the project, on all views and sheets. A window asks for the revision. Useful to set a parameter or comment on all of them at once.
  ko: 프로젝트에서 한 수정 사항의 모든 수정 기호를 모든 뷰와 시트에서 선택합니다. 창에서 수정 사항을 선택합니다. 모든 수정 기호에 매개변수나 주석을 한 번에 설정할 때 유용합니다.
  fr_fr: Sélectionne tous les nuages de révision d'une révision du projet, dans toutes les vues et feuilles. Une fenêtre demande la révision. Utile pour définir un paramètre ou un commentaire sur tous les nuages à la fois.
  ru: Выделяет все пометочные облака одного изменения в проекте, на всех видах и листах. В окне нужно выбрать изменение. Полезно, чтобы задать параметр или комментарий сразу для всех облаков.
  chinese_s: 选择项目中某一修订的所有修订云线，涵盖所有视图和图纸。会弹出窗口让您选择修订。有助于一次性为所有云线设置参数或添加注释。
  es_es: Selecciona todas las nubes de revisión de una revisión del proyecto, en todas las vistas y planos. Una ventana pregunta por la revisión. Es útil para establecer un parámetro o comentario en todas a la vez.
  de_de: Wählt alle Änderungswolken einer Änderung im Projekt aus, in allen Ansichten und Plänen. Ein Fenster fragt nach der Änderung (Revision). Praktisch, um einen Parameter oder Kommentar für alle auf einmal zu setzen.
  pt_br: Seleciona todas as nuvens de revisão de uma revisão do projeto, em todas as vistas e folhas. Uma janela pergunta a revisão. Útil para definir um parâmetro ou comentário em todas de uma vez.
context: doc-project
