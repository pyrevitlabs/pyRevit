title:
  en_us: Select Element Types
  ko: 요소 유형 선택
  fr_fr: Sélectionner les types de l'élément
  ru: Выделить типы элементов
  chinese_s: 选择图元类型
  es_es: Seleccionar tipos de elementos
  de_de: Wähle Element Typen aus
  pt_br: Selecionar Tipos de Elemento
tooltip:
  en_us: Select all types of one family, all graphics styles of one category, or all fill patterns, area schemes or line styles in the project. A window asks what to select. Revit does not mark selected types as types, so they look like instances in the selection.
  ko: 프로젝트에서 한 패밀리의 모든 유형, 한 카테고리의 모든 그래픽 스타일, 또는 모든 채우기 패턴, 면적 구성표, 선 스타일을 선택합니다. 창에서 선택할 대상을 고릅니다. Revit은 선택한 유형을 유형으로 표시하지 않으므로 선택 항목에서 인스턴스처럼 보입니다.
  fr_fr: |-
    Sélectionne dans le projet tous les types d'une famille, tous les styles graphiques d'une catégorie, ou tous les motifs de remplissage, schémas de surface ou styles de ligne. Une fenêtre demande quoi sélectionner. Revit n'indique pas que les types sélectionnés sont des types : ils ressemblent à des instances dans la sélection.
  ru: Выделяет в проекте все типоразмеры одного семейства, все стили графики одной категории либо все узоры заливки, схемы площадей или стили линий. В окне нужно выбрать, что выделить. Revit не помечает выбранные типоразмеры как типы, поэтому в выборке они выглядят как экземпляры.
  chinese_s: 选择项目中某个族的所有类型、某一类别的所有图形样式，或所有填充样式、面积方案或线样式。会弹出窗口让您选择要选取的内容。Revit 不会将选中的类型标识为类型，因此它们在选择中看起来像实例。
  es_es: Selecciona en el proyecto todos los tipos de una familia, todos los estilos de gráficos de una categoría, o todos los patrones de relleno, esquemas de áreas o estilos de línea. Una ventana pregunta qué seleccionar. Revit no marca los tipos seleccionados como tipos, así que parecen instancias en la selección.
  de_de: Wählt im Projekt alle Typen einer Familie, alle Grafikstile einer Kategorie oder alle Füllmuster, Flächenschemata oder Linienstile aus. Ein Fenster fragt, was ausgewählt werden soll. Revit kennzeichnet ausgewählte Typen nicht als Typen, sie sehen in der Auswahl wie Exemplare aus.
  pt_br: Seleciona no projeto todos os tipos de uma família, todos os estilos gráficos de uma categoria, ou todos os padrões de preenchimento, esquemas de área ou estilos de linha. Uma janela pergunta o que selecionar. O Revit não marca os tipos selecionados como tipos, por isso eles parecem instâncias na seleção.
