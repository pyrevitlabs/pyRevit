title:
  en_us: Keep Mirrored ●
  ko: 미러 유지 ●
  fr_fr: Conserve symétrisés ●
  ru: Удержать отзеркаленные ●
  chinese_s: 保留已镜像图元 ●
  es_es: Mantener reflejados ●
  de_de: Nur gespiegelte Elemente in aktueller Auswahl belassen ●
  pt_br: Manter Espelhados ●
tooltip:
  en_us: |-
    Keep only the mirrored family instances in the current selection; all other elements are dropped. With nothing selected, draw a rectangle to select the mirrored family instances inside it.

    Shift-click:
    Keep only the family instances that are not mirrored.
  ko: |-
    현재 선택 항목에서 미러된 패밀리 인스턴스만 유지하고 다른 요소는 제외합니다. 선택한 항목이 없으면 사각형을 그려 그 안에서 미러된 패밀리 인스턴스를 선택합니다.

    Shift 키를 누르고 클릭:
    미러되지 않은 패밀리 인스턴스만 유지합니다.
  fr_fr: |-
    Conservez dans la sélection actuelle uniquement les instances de famille symétrisées ; les autres éléments sont retirés. Si rien n'est sélectionné, tracez un rectangle pour sélectionner les instances de famille symétrisées qu'il contient.

    Maj+clic :
    Conserver uniquement les instances de famille non symétrisées.
  ru: |-
    Оставьте в текущем выборе только отзеркаленные экземпляры семейств; остальные элементы отбрасываются. Если ничего не выбрано, нарисуйте прямоугольник, чтобы выбрать внутри него отзеркаленные экземпляры семейств.

    Shift + Щелчок:
    Оставить только экземпляры семейств, которые не отзеркалены.
  chinese_s: |-
    在当前选择中仅保留已镜像的族实例，其他图元会被舍弃。若未选择任何内容，则绘制矩形，选择其中已镜像的族实例。

    按住 Shift 键单击：
    仅保留未镜像的族实例。
  es_es: |-
    Conserve en la selección actual solo las instancias de familia reflejadas; el resto de elementos se descarta. Si no hay nada seleccionado, dibuje un rectángulo para seleccionar las instancias de familia reflejadas que contiene.

    Mayús-clic:
    Conservar solo las instancias de familia que no estén reflejadas.
  de_de: |-
    In der aktuellen Auswahl nur gespiegelte Familieninstanzen behalten; alle anderen Elemente fallen weg. Ist nichts ausgewählt, ein Rechteck aufziehen, um die gespiegelten Familieninstanzen darin auszuwählen.

    Bei gedrückter Umschalttaste klicken:
    Nur Familieninstanzen behalten, die nicht gespiegelt sind.
  pt_br: |-
    Mantenha na seleção atual apenas as instâncias de família espelhadas; os outros elementos são descartados. Se nada estiver selecionado, desenhe um retângulo para selecionar as instâncias de família espelhadas dentro dele.

    Clique mantendo a tecla Shift pressionada:
    Manter apenas as instâncias de família que não estão espelhadas.
