title:
  en_us: Discard Pinned Elements
  ko: 고정된 요소 제외
  fr_fr: Enlève les éléments épinglés
  ru: Отбросить прикрепленные элементы
  chinese_s: 排除锁定图元
  es_es: Descartar elementos fijados
  de_de: Gepinnte Elemente von der aktuellen Auswahl ausschliessen
  pt_br: Descartar Elementos Fixados
tooltip:
  en_us: |-
    Remove pinned elements from the current selection. The elements are not deleted. With nothing selected, draw a rectangle to select everything inside it that is not pinned.
  ko: |-
    현재 선택 항목에서 고정된 요소를 제외합니다. 요소는 삭제되지 않습니다. 선택한 항목이 없으면 사각형을 그려 그 안에서 고정되지 않은 모든 요소를 선택합니다.
  fr_fr: |-
    Retirez les éléments épinglés de la sélection actuelle. Les éléments ne sont pas supprimés. Si rien n'est sélectionné, tracez un rectangle pour sélectionner tout ce qu'il contient qui n'est pas épinglé.
  ru: |-
    Уберите из текущего выбора прикреплённые элементы. Элементы не удаляются. Если ничего не выбрано, нарисуйте прямоугольник, чтобы выбрать внутри него всё, что не прикреплено.
  chinese_s: |-
    从当前选择中移除已锁定的图元（图元不会被删除）。若未选择任何内容，则绘制矩形，选择其中所有未锁定的图元。
  es_es: |-
    Quite los elementos fijados de la selección actual. Los elementos no se eliminan. Si no hay nada seleccionado, dibuje un rectángulo para seleccionar todo lo que contiene que no esté fijado.
  de_de: |-
    Gepinnte Elemente aus der aktuellen Auswahl entfernen. Die Elemente werden nicht gelöscht. Ist nichts ausgewählt, ein Rechteck aufziehen, um alles darin auszuwählen, was nicht gepinnt ist.
  pt_br: |-
    Remova os elementos fixados da seleção atual. Os elementos não são excluídos. Se nada estiver selecionado, desenhe um retângulo para selecionar tudo o que estiver dentro dele e não estiver fixado.
context:
  any:
    - selection
    - active-plan-view
    - active-section-view
    - active-elevation-view
    - active-3d-view
    - active-sheet
