title:
  en_us: Discard Grouped Elements
  ko: 그룹 요소 제외
  fr_fr: Enlève les éléments groupés
  ru: Отбросить сгруппированные элементы
  chinese_s: 排除编组图元
  es_es: Descartar elementos agrupados
  de_de: Gruppierte Elemente von der aktuellen Auswahl ausschliessen
  pt_br: Descartar Elementos Agrupados
tooltip:
  en_us: |-
    Remove groups and the elements inside groups from the current selection. The elements are not deleted. With nothing selected, draw a rectangle to select everything inside it that is not grouped.
  ko: |-
    현재 선택 항목에서 그룹과 그룹에 속한 요소를 제외합니다. 요소는 삭제되지 않습니다. 선택한 항목이 없으면 사각형을 그려 그 안에서 그룹에 속하지 않은 모든 요소를 선택합니다.
  fr_fr: |-
    Retirez les groupes et les éléments groupés de la sélection actuelle. Les éléments ne sont pas supprimés. Si rien n'est sélectionné, tracez un rectangle pour sélectionner tout ce qu'il contient qui n'est pas groupé.
  ru: |-
    Уберите из текущего выбора группы и элементы, входящие в группы. Элементы не удаляются. Если ничего не выбрано, нарисуйте прямоугольник, чтобы выбрать внутри него всё, что не входит в группы.
  chinese_s: |-
    从当前选择中移除组以及组内的图元（图元不会被删除）。若未选择任何内容，则绘制矩形，选择其中所有未编组的图元。
  es_es: |-
    Quite los grupos y los elementos que están dentro de grupos de la selección actual. Los elementos no se eliminan. Si no hay nada seleccionado, dibuje un rectángulo para seleccionar todo lo que contiene que no esté agrupado.
  de_de: |-
    Gruppen und Elemente in Gruppen aus der aktuellen Auswahl entfernen. Die Elemente werden nicht gelöscht. Ist nichts ausgewählt, ein Rechteck aufziehen, um alles darin auszuwählen, was nicht gruppiert ist.
  pt_br: |-
    Remova os grupos e os elementos dentro de grupos da seleção atual. Os elementos não são excluídos. Se nada estiver selecionado, desenhe um retângulo para selecionar tudo o que estiver dentro dele e não for agrupado.
