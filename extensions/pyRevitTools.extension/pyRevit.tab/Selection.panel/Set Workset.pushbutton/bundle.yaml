tooltip:
  en_us: |-
    Set the active workset based on the selection.

    Shift-click:
    Configure whether to set the workset, check out elements, set or show the workplane, and set the phase.
  ko: |-
    선택 항목을 기준으로 활성 작업 세트를 설정합니다.

    Shift 키를 누르고 클릭:
    작업 세트 설정, 요소 체크아웃, 작업 기준면 설정 또는 표시, 단계 설정 방식을 구성합니다.
  fr_fr: |-
    Définit le sous-projet actif à partir de la sélection.

    Maj+clic :
    Configurer la définition du sous-projet, l'emprunt des éléments, le réglage ou l'affichage du plan de travail et la phase.
  ru: |-
    Устанавливает текущий рабочий набор на основе выбранных элементов.

    Щелчок с удержанием клавиши Shift:
    Настроить рабочий набор, заимствование элементов, установку или отображение рабочей плоскости и фазу.
  chinese_s: |-
    根据所选内容设置活动工作集。

    按住 Shift 键单击：
    配置工作集设置、借用图元、设置或显示工作平面以及设置阶段。
  es_es: |-
    Establece el área de trabajo activa a partir de la selección.

    Mayús-clic:
    Configurar si se establece el área de trabajo, se toman prestados elementos, se establece o muestra el plano de trabajo y se define la fase.
  de_de: |-
    Legt anhand der Auswahl den aktiven Arbeitsbereich (Workset) fest.

    Bei gedrückter Umschalttaste klicken:
    Festlegen, ob der Arbeitsbereich gesetzt, Elemente ausgeliehen, die Arbeitsebene gesetzt oder angezeigt und die Phase festgelegt wird.
  pt_br: |-
    Define o workset ativo com base na seleção.

    Clique mantendo a tecla Shift pressionada:
    Configurar se o workset será definido, elementos serão emprestados, o plano de trabalho será definido ou exibido e a fase será definida.
