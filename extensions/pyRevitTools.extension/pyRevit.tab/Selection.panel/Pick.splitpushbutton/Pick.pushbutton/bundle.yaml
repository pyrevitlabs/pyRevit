title:
  en_us: Pick
  ko: 선택
  fr_fr: Sélectionner
  ru: Выбрать
  chinese_s: 选择
  es_es: Elegir
  de_de: El.n.Kat.ausw.
  pt_br: Selecionar
tooltip:
  en_us: |-
    Choose one of your favorite categories, then draw a rectangle to select only the elements of that category inside it. The result replaces the current selection.

    Shift-click:
    Choose your favorite categories from all categories of the project. The Isolate button uses the same list.
  ko: |-
    즐겨찾기 카테고리 하나를 선택한 다음, 사각형을 그려 그 안에서 해당 카테고리의 요소만 선택합니다. 결과는 현재 선택 항목을 대체합니다.

    Shift 키를 누르고 클릭:
    프로젝트의 모든 카테고리 중에서 즐겨찾기 카테고리를 선택합니다. 격리 버튼도 같은 목록을 사용합니다.
  fr_fr: |-
    Choisissez l'une de vos catégories favorites, puis tracez un rectangle pour sélectionner uniquement les éléments de cette catégorie qu'il contient. Le résultat remplace la sélection actuelle.

    Maj+clic :
    Choisir vos catégories favorites parmi toutes les catégories du projet. Le bouton Isoler utilise la même liste.
  ru: |-
    Выберите одну из избранных категорий, затем нарисуйте прямоугольник, чтобы выбрать внутри него только элементы этой категории. Результат заменяет текущий выбор.

    Shift + Щелчок:
    Выбрать избранные категории из всех категорий проекта. Кнопка «Изолировать» использует тот же список.
  chinese_s: |-
    选择一个收藏类别，然后绘制矩形，仅选择其中属于该类别的图元。结果会替换当前选择。

    按住 Shift 键单击：
    从项目的所有类别中选择收藏类别。“隔离”按钮使用同一列表。
  es_es: |-
    Elija una de sus categorías favoritas y dibuje un rectángulo para seleccionar solo los elementos de esa categoría que contiene. El resultado sustituye la selección actual.

    Mayús-clic:
    Elegir las categorías favoritas entre todas las categorías del proyecto. El botón Aislar usa la misma lista.
  de_de: |-
    Eine der Favoritenkategorien wählen, dann ein Rechteck aufziehen, um nur die Elemente dieser Kategorie darin auszuwählen. Das Ergebnis ersetzt die aktuelle Auswahl.

    Bei gedrückter Umschalttaste klicken:
    Die Favoritenkategorien aus allen Kategorien des Projekts auswählen. Die Schaltfläche „Isolieren“ verwendet dieselbe Liste.
  pt_br: |-
    Escolha uma das suas categorias favoritas e desenhe um retângulo para selecionar apenas os elementos dessa categoria dentro dele. O resultado substitui a seleção atual.

    Clique mantendo a tecla Shift pressionada:
    Escolher as categorias favoritas entre todas as categorias do projeto. O botão Isolar usa a mesma lista.
