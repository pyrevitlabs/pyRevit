title:
  en_us: Pick Elements by Parameter Value ●
  ko: 매개변수 값으로 요소 선택 ●
  fr_fr: Sélectionner des éléments par valeur de paramètre ●
  ru: Выбрать элементы по значению параметра ●
  chinese_s: 按参数值选择图元 ●
  es_es: Seleccionar elementos por valor de parámetro ●
  de_de: Elemente nach Parameterwert auswählen ●
  pt_br: Selecionar Elementos por Valor de Parâmetro ●

tooltip:
  en_us: |-
    Select elements that match the chosen parameter value or values. By default, any matching value is accepted.

    Shift-click:
    Require every chosen parameter value to match.
  ko: |-
    선택한 매개변수 값과 일치하는 요소를 선택합니다. 기본적으로 하나 이상의 값이 일치하면 선택됩니다.

    Shift 키를 누르고 클릭:
    선택한 모든 매개변수 값이 일치해야 선택되도록 합니다.
  fr_fr: |-
    Sélectionne les éléments correspondant aux valeurs de paramètres choisies. Par défaut, toute valeur correspondante est acceptée.

    Maj+clic :
    Exiger que toutes les valeurs de paramètres choisies correspondent.
  ru: |-
    Выбирает элементы, совпадающие с выбранными значениями параметров. По умолчанию достаточно любого совпадения.

    Щелчок с удержанием клавиши Shift:
    Требовать совпадения каждого выбранного значения параметра.
  chinese_s: |-
    选择与所选参数值匹配的图元。默认情况下，任一参数值匹配即可。

    按住 Shift 键单击：
    要求每个所选参数值都匹配。
  es_es: |-
    Selecciona elementos que coinciden con los valores de parámetro elegidos. De forma predeterminada, se acepta cualquier coincidencia.

    Mayús-clic:
    Exigir que coincidan todos los valores de parámetro elegidos.
  de_de: |-
    Wählt Elemente mit übereinstimmenden Parameterwerten aus. Standardmäßig reicht eine beliebige Übereinstimmung.

    Bei gedrückter Umschalttaste klicken:
    Verlangen, dass alle ausgewählten Parameterwerte übereinstimmen.
  pt_br: |-
    Seleciona elementos que correspondem aos valores de parâmetro escolhidos. Por padrão, qualquer correspondência é aceita.

    Clique mantendo a tecla Shift pressionada:
    Exigir que todos os valores de parâmetro escolhidos correspondam.

