title:
  en_us: Pick Elements by Parameter Value ●
  ko: 매개변수 값으로 요소 선택 ●
  fr_fr: Sélectionner des éléments par valeur de paramètre ●
  ru: Выбрать элементы по значению параметра ●
  chinese_s: 按参数值选择图元 ●
  es_es: Seleccionar elementos por valor de parámetro ●
  de_de: Elemente nach Parameterwert auswählen ●
  pt_br: Selecionar Elementos por Valor de Parâmetro ●

tooltip:
  en_us: |-
    Use the selected element, or pick one, then choose which of its parameters to match. Draw a rectangle to select the elements inside it that have the same value for any of the chosen parameters.

    Shift-click:
    Select only elements that have the same value for every chosen parameter.
  ko: |-
    선택한 요소를 사용하거나 요소를 하나 선택한 다음, 일치시킬 매개변수를 고릅니다. 사각형을 그려 그 안에서 선택한 매개변수 중 하나라도 값이 같은 요소를 선택합니다.

    Shift 키를 누르고 클릭:
    선택한 모든 매개변수의 값이 같은 요소만 선택합니다.
  fr_fr: |-
    Utilisez l'élément sélectionné ou choisissez-en un, puis indiquez les paramètres à comparer. Tracez un rectangle pour sélectionner les éléments qu'il contient dont la valeur est identique pour l'un des paramètres choisis.

    Maj+clic :
    Sélectionner uniquement les éléments dont la valeur est identique pour tous les paramètres choisis.
  ru: |-
    Используйте выбранный элемент или укажите его, затем выберите параметры для сравнения. Нарисуйте прямоугольник, чтобы выбрать внутри него элементы, у которых совпадает значение хотя бы одного из выбранных параметров.

    Shift + Щелчок:
    Выбирать только элементы, у которых совпадают значения всех выбранных параметров.
  chinese_s: |-
    使用已选图元，或拾取一个图元，然后选择要匹配的参数。绘制矩形，选择其中任一所选参数值相同的图元。

    按住 Shift 键单击：
    仅选择所有所选参数值都相同的图元。
  es_es: |-
    Use el elemento seleccionado o elija uno y, a continuación, elija los parámetros que deben coincidir. Dibuje un rectángulo para seleccionar los elementos que contiene con el mismo valor en alguno de los parámetros elegidos.

    Mayús-clic:
    Seleccionar solo los elementos con el mismo valor en todos los parámetros elegidos.
  de_de: |-
    Das ausgewählte Element verwenden oder eines wählen, dann die zu vergleichenden Parameter auswählen. Ein Rechteck aufziehen, um die Elemente darin auszuwählen, die bei mindestens einem der gewählten Parameter denselben Wert haben.

    Bei gedrückter Umschalttaste klicken:
    Nur Elemente auswählen, die bei allen gewählten Parametern denselben Wert haben.
  pt_br: |-
    Use o elemento selecionado ou escolha um e depois escolha os parâmetros a comparar. Desenhe um retângulo para selecionar os elementos dentro dele que têm o mesmo valor em qualquer um dos parâmetros escolhidos.

    Clique mantendo a tecla Shift pressionada:
    Selecionar apenas elementos com o mesmo valor em todos os parâmetros escolhidos.

