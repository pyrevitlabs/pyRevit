title:
  en_us: MWrite
  ko: 메모리 저장
  fr_fr: MEcrire
  ru: ПЗаписать
  chinese_s: M写入
  es_es: MEscribir
  de_de: Sp.mit.El.überschr.
  pt_br: MWrite
tooltip:
  en_us: |-
    Replace the selection memory of the active document with the selected elements, like MC followed by M+ on a calculator.

    Each document has its own memory, saved as a .pym file in %appdata%\pyRevit.
  de_de: |-
    Ersetzt den Auswahlspeicher des aktiven Dokuments durch die gewählten Elemente, wie MC gefolgt von M+ beim Taschenrechner.

    Jedes Dokument hat seinen eigenen Speicher, der als .pym-Datei in %appdata%\pyRevit gespeichert wird.
  fr_fr: |-
    Remplace la mémoire de sélection du document actif par les éléments sélectionnés, comme MC suivi de M+ sur une calculatrice.

    Chaque document a sa propre mémoire, enregistrée sous forme de fichier .pym dans %appdata%\pyRevit.
  es_es: |-
    Reemplaza la memoria de selección del documento activo por los elementos seleccionados, como MC seguido de M+ en una calculadora.

    Cada documento tiene su propia memoria, guardada como archivo .pym en %appdata%\pyRevit.
  pt_br: |-
    Substitui a memória de seleção do documento ativo pelos elementos selecionados, como MC seguido de M+ em uma calculadora.

    Cada documento tem sua própria memória, salva como arquivo .pym em %appdata%\pyRevit.
  ru: |-
    Заменяет память выбора активного документа выбранными элементами, как MC и затем M+ в калькуляторе.

    У каждого документа своя память, которая хранится в файле .pym в папке %appdata%\pyRevit.
  chinese_s: |-
    用所选图元替换活动文档的选择内存，功能类似于计算器上先按 MC 再按 M+。

    每个文档都有自己的内存，保存为 %appdata%\pyRevit 中的 .pym 文件。
  ko: |-
    활성 문서의 선택 메모리를 선택한 요소로 바꿉니다. 계산기에서 MC 다음에 M+를 누르는 것과 같습니다.

    각 문서에는 자체 메모리가 있으며 %appdata%\pyRevit 폴더에 .pym 파일로 저장됩니다.
context: selection
