title:
  en_us: MAppend
  ko: 메모리 추가
  fr_fr: MAjouter
  ru: ПДобавить
  chinese_s: M追加
  es_es: MAgregar
  de_de: El.z.Sp.hinzufügen
  pt_br: MAppend
tooltip:
  en_us: |-
    Add the selected elements to the selection memory of the active document, like M+ on a calculator.

    Each document has its own memory, saved as a .pym file in %appdata%\pyRevit.
  de_de: |-
    Fügt die gewählten Elemente dem Auswahlspeicher des aktiven Dokuments hinzu, wie M+ beim Taschenrechner.

    Jedes Dokument hat seinen eigenen Speicher, der als .pym-Datei in %appdata%\pyRevit gespeichert wird.
  fr_fr: |-
    Ajoute les éléments sélectionnés à la mémoire de sélection du document actif, comme M+ sur une calculatrice.

    Chaque document a sa propre mémoire, enregistrée sous forme de fichier .pym dans %appdata%\pyRevit.
  es_es: |-
    Agrega los elementos seleccionados a la memoria de selección del documento activo, como M+ en una calculadora.

    Cada documento tiene su propia memoria, guardada como archivo .pym en %appdata%\pyRevit.
  pt_br: |-
    Adiciona os elementos selecionados à memória de seleção do documento ativo, como o M+ de uma calculadora.

    Cada documento tem sua própria memória, salva como arquivo .pym em %appdata%\pyRevit.
  ru: |-
    Добавляет выбранные элементы в память выбора активного документа, как кнопка M+ в калькуляторе.

    У каждого документа своя память, которая хранится в файле .pym в папке %appdata%\pyRevit.
  chinese_s: |-
    将所选图元添加到活动文档的选择内存中，功能类似于计算器上的 M+ 按钮。

    每个文档都有自己的内存，保存为 %appdata%\pyRevit 中的 .pym 文件。
  ko: |-
    선택한 요소를 활성 문서의 선택 메모리에 추가합니다. 계산기의 M+ 버튼과 같습니다.

    각 문서에는 자체 메모리가 있으며 %appdata%\pyRevit 폴더에 .pym 파일로 저장됩니다.
context: selection
