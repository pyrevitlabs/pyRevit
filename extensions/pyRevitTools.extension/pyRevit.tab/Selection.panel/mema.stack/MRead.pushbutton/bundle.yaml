title:
  en_us: MRead
  ko: 메모리 읽기
  fr_fr: MLire
  ru: ПВыделить
  chinese_s: M读取
  es_es: MLeer
  de_de: El.im Sp.auswählen
  pt_br: MRead
tooltip:
  en_us: |-
    Select the elements stored in the selection memory of the active document, like MR on a calculator. Elements that no longer exist are skipped.

    Each document has its own memory, saved as a .pym file in %appdata%\pyRevit.
  de_de: |-
    Wählt die Elemente aus dem Auswahlspeicher des aktiven Dokuments aus, wie MR beim Taschenrechner. Elemente, die es nicht mehr gibt, werden übersprungen.

    Jedes Dokument hat seinen eigenen Speicher, der als .pym-Datei in %appdata%\pyRevit gespeichert wird.
  fr_fr: |-
    Sélectionne les éléments de la mémoire de sélection du document actif, comme MR sur une calculatrice. Les éléments qui n'existent plus sont ignorés.

    Chaque document a sa propre mémoire, enregistrée sous forme de fichier .pym dans %appdata%\pyRevit.
  es_es: |-
    Selecciona los elementos de la memoria de selección del documento activo, como MR en una calculadora. Los elementos que ya no existen se omiten.

    Cada documento tiene su propia memoria, guardada como archivo .pym en %appdata%\pyRevit.
  pt_br: |-
    Seleciona os elementos da memória de seleção do documento ativo, como o MR de uma calculadora. Os elementos que não existem mais são ignorados.

    Cada documento tem sua própria memória, salva como arquivo .pym em %appdata%\pyRevit.
  ru: |-
    Выбирает элементы из памяти выбора активного документа, как кнопка MR в калькуляторе. Элементы, которых больше нет, пропускаются.

    У каждого документа своя память, которая хранится в файле .pym в папке %appdata%\pyRevit.
  chinese_s: |-
    选择活动文档的选择内存中保存的图元，功能类似于计算器上的 MR 按钮。已不存在的图元将被跳过。

    每个文档都有自己的内存，保存为 %appdata%\pyRevit 中的 .pym 文件。
  ko: |-
    활성 문서의 선택 메모리에 저장된 요소를 선택합니다. 계산기의 MR 버튼과 같습니다. 더 이상 존재하지 않는 요소는 건너뜁니다.

    각 문서에는 자체 메모리가 있으며 %appdata%\pyRevit 폴더에 .pym 파일로 저장됩니다.
