title:
  en_us: Lines Per View Counter ●
  ko: 뷰별 선 개수 카운터 ●
  fr_fr: Compteur de lignes par vue ●
  ru: Посчитать линии детализации по видам ●
  chinese_s: 视图线数统计器 ●
  es_es: Contador de líneas por vista ●
  de_de: Anzahl der Linien je Ansicht ●
  pt_br: Contador de Linhas por Vista ●
tooltip:
  en_us: |-
    List detail-line counts for each view in the current document, sorted by count.

    Shift-click:
    Include detail-line counts from linked Revit models.
  ko: |-
    현재 문서의 각 뷰에서 상세 선 개수를 세어 정렬하여 표시합니다.

    Shift 키를 누르고 클릭:
    링크된 Revit 모델의 상세 선 개수도 포함합니다.
  fr_fr: |-
    Liste par ordre décroissant le nombre de lignes de détail dans chaque vue du document actuel.

    Maj+clic :
    Inclure également les lignes de détail des modèles Revit liés.
  ru: |-
    Выводит отсортированное количество линий детализации для каждого вида текущего документа.

    Щелчок с удержанием клавиши Shift:
    Включить количество линий детализации из связанных моделей Revit.
  chinese_s: |-
    列出当前文档中每个视图的详图线数量，并按数量排序。

    按住 Shift 键单击：
    同时统计链接 Revit 模型中的详图线。
  es_es: |-
    Lista ordenadamente el número de líneas de detalle de cada vista del documento actual.

    Mayús-clic:
    Incluir también las líneas de detalle de los modelos Revit vinculados.
  de_de: |-
    Listet die Anzahl der Detaillinien für jede Ansicht im aktuellen Dokument sortiert auf.

    Bei gedrückter Umschalttaste klicken:
    Detaillinien aus verknüpften Revit-Modellen ebenfalls einbeziehen.
  pt_br: |-
    Lista, ordenadas pela quantidade, as linhas de detalhe de cada vista do documento atual.

    Clique mantendo a tecla Shift pressionada:
    Incluir também as linhas de detalhe dos modelos Revit vinculados.
author: 'Original by Frederic Beaupere; Improvements by Jean-Marc Couffin'
