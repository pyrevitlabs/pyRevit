title:
  en_us: Diagnose Invisibility
  de_de: Sichtbarkeit diagnostizieren
  fr_fr: Diagnostiquer Invisibilité
  es_es: Diagnosticar Invisibilidad
  ru: Диагностика невидимости
  ko: 비가시성 진단
  chinese_s: 诊断 不可见性
  pt_br: Diagnosticar Invisibilidade

tooltip:
  en_us: |-
    Explains why the selected (or picked) element(s) are not visible in a chosen view - checks workset, phase, design option, category/ subcategory visibility, element hide state, view filters, crop region, section box, view range, view template, and view-specific ownership. In the WebView2 output window the report is interactive: one-click fixes, selection and a 3D preview of the view's clipping. You can add or remove elements and views there, and hide or unhide elements across several views.

    Shift-click:
    Reveal every element hidden in the active view, drawn in Revit in one color per reason.
  de_de: |-
    Erklärt, warum das/die ausgewählte(n) (oder aufgenommene(n)) Element(e) in einer gewählten Ansicht nicht sichtbar sind - prüft Bauteilbereich (Workset), Phase, Planungsoption, Sichtbarkeit von Kategorie/Unterkategorie, Ausblendstatus, Ansichtsfilter, Ausschnittbereich, Schnittbox, Ansichtsbereich, Ansichtsvorlage und ansichtsspezifische Zugehörigkeit. Im WebView2-Ausgabefenster ist der Bericht interaktiv: Korrekturen per Klick, Auswahl und eine 3D-Vorschau der Ansichtsbegrenzung. Dort lassen sich Elemente und Ansichten hinzufügen oder entfernen sowie Elemente in mehreren Ansichten aus- oder einblenden.

    Umschalt-Klick:
    Alle in der aktiven Ansicht ausgeblendeten Elemente aufdecken, in Revit je Grund in einer Farbe gezeichnet.
  fr_fr: |-
    Explique pourquoi le(s) élément(s) sélectionné(s) (ou choisi(s)) ne sont pas visibles dans une vue donnée - vérifie le sous-projet (workset), la phase, l'option de conception, la visibilité de la catégorie/sous-catégorie, l'état masqué de l'élément, les filtres de vue, la zone de recadrage, la boîte de coupe 3D, l'étendue de la vue, le gabarit de vue et l'appartenance à une autre vue. Dans la fenêtre de sortie WebView2, le rapport est interactif : corrections en un clic, sélection et aperçu 3D du découpage de la vue. Vous pouvez y ajouter ou retirer des éléments et des vues, et masquer ou afficher des éléments dans plusieurs vues.

    Maj+clic :
    Révéler tous les éléments masqués de la vue active, dessinés dans Revit avec une couleur par raison.
  es_es: |-
    Explica por qué el/los elemento(s) seleccionado(s) (o elegido(s)) no son visibles en una vista determinada - comprueba subproyecto (workset), fase, opción de diseño, visibilidad de categoría/ subcategoría, estado oculto del elemento, filtros de vista, región de recorte, caja de sección 3D, rango de vista, plantilla de vista y pertenencia a otra vista. En la ventana de salida WebView2 el informe es interactivo: correcciones con un clic, selección y vista previa 3D del recorte de la vista. Allí puede añadir o quitar elementos y vistas, y ocultar o mostrar elementos en varias vistas.

    Mayús+clic:
    Revelar todos los elementos ocultos de la vista activa, dibujados en Revit con un color por motivo.
  pt_br: |-
    Explica por que o(s) elemento(s) selecionado(s) (ou escolhido(s)) não estão visíveis em uma vista escolhida - verifica subprojeto (workset), fase, opção de projeto, visibilidade de categoria/ subcategoria, estado oculto do elemento, filtros de vista, região de recorte, caixa de seção 3D, alcance da vista, modelo de vista e pertencimento a outra vista. Na janela de saída WebView2 o relatório é interativo: correções com um clique, seleção e visualização 3D do recorte da vista. Lá é possível adicionar ou remover elementos e vistas e ocultar ou reexibir elementos em várias vistas.

    Shift+clique:
    Revelar todos os elementos ocultos na vista ativa, desenhados no Revit com uma cor por motivo.
  ru: |-
    Объясняет, почему выбранный(е) (или указанный(е)) элемент(ы) не видны на выбранном виде - проверяет рабочий набор, фазу, вариант проектирования, видимость категории/подкатегории, состояние скрытия элемента, фильтры вида, область обрезки, секущий объём, диапазон вида, шаблон вида и принадлежность к другому виду. В окне вывода WebView2 отчёт интерактивный: исправления в один щелчок, выбор и 3D-просмотр границ вида. Там можно добавлять и убирать элементы и виды, а также скрывать и показывать элементы сразу на нескольких видах.

    Shift + Щелчок:
    Показать все скрытые элементы активного вида, нарисованные в Revit по одному цвету на причину.
  chinese_s: |-
    说明所选（或拾取）的图元为何在指定视图中不可见——检查工作集、 阶段、设计选项、类别/子类别可见性、图元隐藏状态、视图过滤器、 裁剪区域、剖切框、视图范围、视图样板以及视图专属归属。 在 WebView2 输出窗口中报告可交互：一键修复、选择以及视图裁剪的三维预览。 还可在其中添加或移除图元和视图，并在多个视图中隐藏或取消隐藏图元。

    Shift-单击：
    显示活动视图中所有被隐藏的图元，在 Revit 中按原因分色绘制。
  ko: |-
    선택하거나 지정한 요소가 선택한 뷰에서 보이지 않는 이유를 설명합니다 - 워크셋, 단계, 디자인 옵션, 카테고리/하위 카테고리 표시 여부, 요소 숨김 상태, 뷰 필터, 자르기 영역, 단면 상자, 뷰 범위, 뷰 템플릿, 뷰 전용 소속 여부를 확인합니다. WebView2 출력 창에서는 보고서가 대화형입니다: 클릭 한 번으로 수정, 선택, 뷰 자르기의 3D 미리보기. 여기서 요소와 뷰를 추가하거나 제거하고, 여러 뷰에서 요소를 숨기거나 숨김 해제할 수 있습니다.

    Shift 키를 누르고 클릭:
    활성 뷰에서 숨겨진 모든 요소를 사유별 색상으로 Revit에 그려 보여 줍니다.
engine:
  persistent: true
