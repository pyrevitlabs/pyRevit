title:
  en_us: Get Centroid ●
  ko: 무게중심 가져오기 ●
  fr_fr: Obtenir le centre de gravité ●
  ru: Получить центр тяжести ●
  chinese_s: 获取质心 ●
  es_es: Obtener el centroide ●
  de_de: Schwerpunkt vom gewhälten Element markieren ●
  pt_br: Obter Centroide ●
tooltip:
  en_us: |-
    Calculate the centroid of the selected elements and place three model lines that intersect at that point.

    Shift-click:
    Choose the line style to use for the centroid markers.
  ko: |-
    선택한 요소의 형상 무게중심을 계산하고 무게중심에서 교차하는 세 개의 모델 선을 배치합니다.

    Shift 키를 누르고 클릭:
    무게중심 표시선에 사용할 선 스타일을 선택합니다.
  fr_fr: |-
    Calcule le centre de gravité de la géométrie des éléments sélectionnés et place trois lignes de modèle qui se croisent au centre de gravité.

    Maj+clic :
    Choisir le style de ligne des marqueurs du centre de gravité.
  ru: |-
    Вычисляет центр тяжести геометрии выбранных элементов и размещает три моделируемые линии, пересекающиеся в центре тяжести.

    Щелчок с удержанием клавиши Shift:
    Выбрать стиль линий для обозначения центра тяжести.
  chinese_s: |-
    计算选定元素几何的质心，并在质心处放置三条相交的模型线。

    按住 Shift 键单击：
    选择质心标记使用的线样式。
  es_es: |-
    Calcula el centroide de la geometría de los elementos seleccionados y coloca tres líneas del modelo que se intersectan en el centroide.

    Mayús-clic:
    Elegir el estilo de línea para los marcadores del centroide.
  de_de: |-
    Berechnet den Schwerpunkt der ausgewählten Elementgeometrie und platziert drei Modelllinien, die sich am Schwerpunkt schneiden.

    Bei gedrückter Umschalttaste klicken:
    Den Linienstil für die Schwerpunktmarkierungen auswählen.
  pt_br: |-
    Calcula o centroide da geometria dos elementos selecionados e insere três linhas de modelo que se cruzam no centroide.

    Clique mantendo a tecla Shift pressionada:
    Escolher o estilo de linha dos marcadores do centroide.
author: Tamás Déri
context: selection
