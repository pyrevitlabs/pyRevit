title:
  en_us: Export Parameters to Excel
  ko: 매개변수를 Excel로 내보내기
  fr_fr: Exporter les paramètres vers Excel
  ru: Экспорт параметров в Excel
  chinese_s: 将参数导出到 Excel
  es_es: Exportar parámetros a Excel
  de_de: Parameter nach Excel exportieren
  pt_br: Exportar Parâmetros para Excel
tooltip:
  en_us: |-
    Export element parameters from schedules to Excel, choosing which parameters to include.

    Shift-click:
    Choose an advanced export scope: schedule, document types, document instances, current view, or selection.
  ko: |-
    일람표의 요소 매개변수를 Excel로 내보내고 포함할 매개변수를 선택합니다. 매개변수 값은 다시 가져올 수 있도록 프로젝트 단위로 변환되며, 읽기 전용 또는 지원되지 않는 매개변수는 표시되고 잠깁니다.

    Shift 키를 누르고 클릭:
    내보내기 범위(일람표, 문서 유형, 문서 인스턴스, 현재 뷰 또는 선택 항목)를 지정합니다.
  fr_fr: |
    Exporte les paramètres des éléments à partir des nomenclatures vers un fichier Excel.
    Vous pouvez choisir les paramètres à inclure. Les valeurs sont converties en unités du projet pour permettre une réimportation ultérieure.
    Les paramètres en lecture seule ou non pris en charge sont signalés et verrouillés.

    Maj+clic :
    Choisir une portée d’exportation avancée :
    - nomenclature
    - document - tout
    - document - types
    - document - instances
    - vue actuelle
    - sélection
  ru: |
    Экспортирует параметры элементов из спецификаций в файл Excel.
    Вы можете выбрать, какие параметры включать. Значения параметров преобразуются в проектные единицы для последующего импорта.
    Параметры только для чтения и неподдерживаемые параметры отмечаются и блокируются.

    Щелчок с удержанием клавиши Shift:
    Выбрать расширенную область экспорта:
    - спецификация
    - документ - все
    - документ - типы
    - документ - экземпляры
    - текущий вид
    - выбор
  chinese_s: |-
    将明细表中的图元参数导出到 Excel 文件。您可以选择要包含的参数。参数值会转换为项目单位，以便稍后重新导入；只读和不支持的参数会被标记并锁定。

    按住 Shift 键单击：
    选择高级导出范围：明细表、文档类型、文档实例、当前视图或当前选择。
  es_es: |
    Exporta parámetros de elementos de tablas a un archivo Excel.
    Puede elegir qué parámetros incluir. Los valores de los parámetros se convierten en unidades del proyecto para reimportación posterior.
    Los parámetros de solo lectura y no admitidos se marcan y bloquean.

    Mayús-clic:
    Permite seleccionar un alcance de exportación avanzado:
    - tabla
    - documento - todo
    - documento - tipos
    - documento - instancias
    - vista actual
    - selección
  de_de: |
    Exportiert Elementparameter aus Bauteillisten in eine Excel-Datei.
    Sie können auswählen, welche Parameter einbezogen werden sollen. Die Parameterwerte werden in die Projekteinheiten konvertiert, um einen späteren Reimport zu ermöglichen.
    Schreibgeschützte und nicht unterstützte Parameter werden gekennzeichnet und gesperrt.

    Bei gedrückter Umschalttaste klicken:
    Einen erweiterten Exportbereich auswählen:
    - Bauteilliste
    - Dokument - alle
    - Dokument - Typen
    - Dokument - Instanzen
    - Aktuelle Ansicht
    - Auswahl
  pt_br: >-
    Exporta parâmetros de elementos de tabelas para um arquivo Excel.
    Você pode escolher quais parâmetros incluir. os valores dos parâmetros são convertidos em unidades do projeto para reimportação posterior. 
    Parâmetros somente leitura e não suportados são marcados e bloqueados.
    
    Clique mantendo a tecla Shift pressionada:
    Permite selecionar um escopo de exportação avançado:
    - tabela
    - documento - todos
    - documento - tipos
    - documento - instâncias
    - vista atual
    - seleção
