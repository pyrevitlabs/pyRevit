site_name: pyRevit
repo_url: https://github.com/pyrevitlabs/pyRevit
repo_name: pyrevitlabs/pyRevit

extra:
  homepage: https://pyrevitlabs.io

theme:
  name: material
  logo: static/pyRevitLogo.svg
  favicon: images/favicon.ico
  features:
    - content.code.select
    - content.code.copy
    - toc.follow
    - navigation.top
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - styles.css

watch:
  - pyrevitlib/pyrevit
  - pyRevitfile
  - dev/pyRevitLabs/pyRevitCLI/Resources/UsagePatterns.txt
  - dev/pyRevitLabs.PyRevit.Runtime/ScriptExecutor.cs

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
        - docs/gen_source_pages.py
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [pyrevitlib]
          options:
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: true
            show_category_heading: true
            inherited_members: true
            docstring_options:
              warn_missing_types: false
            filters:
              - "!^_"
              - "^_HostApplication"
  - exclude:
      glob:
        - "*.py"
        - "*.rst"
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.highlight
  - admonition
  - md_in_html
  - toc

